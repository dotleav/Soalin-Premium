  @font-face {
    font-family: 'Persona5Main';
    src: url('./fonts/Persona5main.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
  }
  :root {
    /* ── Base palette: deep indigo-night instead of flat near-black ── */
    --bg: #150f2b;
    --bg-alt: #0d0920;
    --card: #201a42;
    --card-soft: #251e4d;
    --border: #3a2f6e;
    --border-light: #2a2255;
    --text: #f8f4ff;
    --text-secondary: #d2c6f0;
    --muted: #9c8cc9;
    --muted2: #7566a3;
    --muted3: #4f4278;

    /* ── Accents: warm marigold + bubblegum pink duo, not a single flat hue ── */
    --accent: #ffb238;
    --accent-strong: #ff9500;
    --accent-soft: #ffb23820;
    --accent2: #ff5d8f;
    --accent2-soft: #ff5d8f22;

    --correct: #3ddc97;
    --correct-strong: #17b476;
    --wrong: #ff6f6f;
    --wrong-strong: #e5423a;
    --blue: #6cc9ff;
    --blue-strong: #2f8fe0;

    /* Teks di atas latar tint transparan (badge, opsi benar/salah, notifikasi) */
    --tint-correct-text: #a4f4d4;
    --tint-wrong-text: #ffc3c0;

    --shadow-card: 0 4px 0 rgba(10, 6, 26, 0.55);
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 10px;
  }

  /* ── Mode Terang — semua komponen dipakai lewat var(...), jadi cukup timpa token-nya di sini ── */
  body.light {
    --bg: #fbf7ff;
    --bg-alt: #f4eefc;
    --card: #ffffff;
    --card-soft: #f7f1ff;
    --border: #e3d7f7;
    --border-light: #eee5fa;
    --text: #241a3f;
    --text-secondary: #4b3f72;
    --muted: #7c6da3;
    --muted2: #9689b8;
    --muted3: #beb0d9;

    --accent: #d98600;
    --accent-strong: #b96f00;
    --accent-soft: #d9860020;
    --accent2: #d43d76;
    --accent2-soft: #d43d7618;

    --correct: #17a06a;
    --correct-strong: #0d8a58;
    --wrong: #d6453c;
    --wrong-strong: #b93227;
    --blue: #2f7fd6;
    --blue-strong: #1f66b3;

    --tint-correct-text: #0d6b47;
    --tint-wrong-text: #a3271f;

    --shadow-card: 0 3px 0 rgba(70, 50, 110, 0.1);

    background:
      radial-gradient(600px 320px at 12% -8%, #d9860018, transparent 60%),
      radial-gradient(560px 340px at 110% 12%, #d43d7614, transparent 55%),
      var(--bg);
  }

  /* ══════════════════════════════════════════════════════════════════
     Mode Persona 5  —  rework v2, menggunakan asset dari p5-ui-main
     Palet: #ff0022 merah / #1cfeff biru / #000000 hitam / #ffffff putih
     Font: P5UIBold (阿里妈妈数黑体) + Persona5Main + Bebas Neue
     Tidak ada gambar character (bebas copyright)
  ══════════════════════════════════════════════════════════════════ */

  body.p5 {
    --bg: #0d0d0d;
    --bg-alt: #050505;
    --card: #0a0a0a;
    --card-soft: #111111;
    --border: #ff002233;
    --border-light: #ff002218;
    --text: #ffffff;
    --text-secondary: #f0f0f0;
    --muted: #909090;
    --muted2: #6e6e6e;
    --muted3: #4a4a4a;

    /* warna resmi p5-ui */
    --accent: #ff0022;
    --accent-strong: #cc0018;
    --accent-soft: #ff002218;
    --accent2: #ff0022;
    --accent2-soft: #ff002218;

    /* benar = biru tua tegas, salah = merah combat-alert */
    --correct: #1a3fa0;
    --correct-strong: #122d78;
    --wrong: #ff0022;
    --wrong-strong: #cc001a;
    --blue: #1cfeff;
    --blue-strong: #00d4d5;

    --tint-correct-text: #b9cdfa;
    --tint-wrong-text: #ffb3bd;

    --shadow-card: 4px 4px 0 #ff002244;
    --radius-lg: 0px;
    --radius-md: 0px;
    --radius-sm: 0px;

    background:
      radial-gradient(ellipse 60% 35% at 8% 8%, rgba(255,0,34,0.22), transparent 55%),
      radial-gradient(ellipse 40% 50% at 92% 100%, rgba(28,254,255,0.07), transparent 60%),
      linear-gradient(160deg, #0d0d0d 0%, #1a0505 60%, #0d0d0d 100%);
    background-attachment: fixed;
  }

  /* ── P5UI Bold font pada semua teks utama ── */
  body.p5 h1,
  body.p5 h2,
  body.p5 .sectionLabel,
  body.p5 .themeModeTitle,
  body.p5 .catName,
  body.p5 .qNum,
  body.p5 .doneBanner .title,
  body.p5 .scoreHero .pct,
  body.p5 .scoreHero .gradeLabel {
    font-family: "P5UIBold", "Persona5Main", "Bebas Neue", sans-serif;
    font-weight: 700;
    letter-spacing: -0.01em;
    word-spacing: 0.15em;
    text-transform: uppercase;
  }

  /* ── Button: gaya p5-btn-ctn — hitam, putih, bold, skewX ── */
  body.p5 button {
    font-family: "P5UIBold", "Bebas Neue", sans-serif;
    font-weight: 700;
    letter-spacing: -0.01em;
    word-spacing: 0.1em;
    text-transform: uppercase;
  }

  /* pillBtn P5 style — kotak tajam, skew, border putih */
  body.p5 .pillBtn {
    border-radius: 0;
    background: #000;
    color: #fff;
    border: 2px solid #fff;
    transform: skewX(-4deg);
    box-shadow: 3px 3px 0 rgba(255,0,34,0.5);
  }
  body.p5 .pillBtn:hover {
    background: #fff;
    color: #000;
    border-color: #fff;
  }
  body.p5 .pillBtn.active {
    background: #ff0022;
    color: #fff;
    border-color: #ff0022;
    box-shadow: 3px 3px 0 rgba(255,0,34,0.7), 0 0 0 2px #ff002244;
    transform: skewX(-4deg);
  }

  /* nextBtn / restartBtn P5: hitam dgn aksen merah bawah */
  body.p5 .nextBtn,
  body.p5 .restartBtn {
    background: #000;
    color: #ff0022;
    border: 2px solid #ff0022;
    border-radius: 0;
    font-family: "P5UIBold", "Bebas Neue", sans-serif;
    font-weight: 700;
    letter-spacing: -0.01em;
    word-spacing: 0.12em;
    text-transform: uppercase;
    box-shadow: 4px 4px 0 #ff0022;
    transform: skewX(-2deg);
    transition: transform 0.1s, box-shadow 0.1s;
  }
  body.p5 .nextBtn:hover,
  body.p5 .restartBtn:hover {
    background: #ff0022;
    color: #fff;
    transform: skewX(-2deg) translateY(-2px);
    box-shadow: 4px 6px 0 #88001100;
  }
  body.p5 .nextBtn:active,
  body.p5 .restartBtn:active {
    transform: skewX(-2deg) translateY(2px);
    box-shadow: 2px 2px 0 #ff0022;
  }

  /* ── Header bar: garis merah tebal di atas ── */
  body.p5 .headerZone::before {
    height: 6px;
    background: #ff0022;
  }

  /* ── pickerHeader: diagonal stripe background (p5-ui style) + P5UI font ── */
  body.p5 .pickerHeader h1 {
    font-family: "Persona5Main", "P5UIBold", "Bebas Neue", sans-serif;
    letter-spacing: 0.02em;
    text-shadow: 4px 4px 0 #ff0022, -1px -1px 0 #000;
    color: #fff;
  }
  body.p5 .pickerHeader {
    position: relative;
    overflow: hidden;
    background: #000;
    padding: 36px 0 22px;
  }
  body.p5 .pickerHeader::before {
    content: "";
    position: absolute;
    inset: -30% -15%;
    background: repeating-linear-gradient(
      -35deg,
      rgba(255, 0, 34, 0.18) 0px,
      rgba(255, 0, 34, 0.18) 12px,
      transparent 12px,
      transparent 28px
    );
    pointer-events: none;
    z-index: 0;
  }
  body.p5 .pickerHeader::after {
    content: "";
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 4px;
    background: #ff0022;
    z-index: 2;
  }
  body.p5 .pickerHeader > * { position: relative; z-index: 1; }

  /* ── Card: hitam dengan shadow merah bawah-kanan ── */
  body.p5 .qCard,
  body.p5 .progressCard,
  body.p5 .settingsCard,
  body.p5 .categoryGroup {
    background: #0a0a0a;
    border: 1.5px solid #ff002233;
    border-radius: 0;
    box-shadow: 4px 4px 0 #ff002244;
  }
  /* Potongan sudut acak di KEEMPAT sudut (bukan cuma 1) + rotasi kecil —
     biar dari jauh kelihatan gak kotak rapi lagi, tapi masih rapi/terbaca. */
  body.p5 .progressCard {
    clip-path: polygon(10px 0, calc(100% - 4px) 0, 100% 9px, 100% 100%, 16px 100%, 0 calc(100% - 6px));
    transform: rotate(-0.7deg);
  }
  body.p5 .settingsCard {
    clip-path: polygon(0 6px, 14px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 8px) 100%, 4px 100%);
    transform: rotate(0.55deg);
  }

  /* ── Divider (p5-divider-ctn style): merah solid 4px ── */
  body.p5 .modeBar {
    border-bottom: 4px solid #ff0022;
    background: #000;
  }
  body.p5 .filterBar {
    border-bottom: 3px solid #ff002255;
    background: #000;
  }
  body.p5 header {
    border-bottom: 4px solid #ff0022;
    background: #000;
  }

  /* ── Progress bar: merah flash ── */
  body.p5 .progressTrack {
    background: #1a1a1a;
    border-radius: 0;
    height: 6px;
  }
  body.p5 .progressFill {
    background: #ff0022;
    border-radius: 0;
  }

  /* ── Answer option buttons: p5 combat feel ──
       (selector dulu salah: ".optGrid button" — elemen aslinya ".options .option",
       jadi style ini dari dulu gak pernah kepakai. Sudah dibetulkan + dikasih
       clip-path doodle yang beda-beda tiap baris + rotasi acak-tapi-rapi.) */
  body.p5 .options .option {
    background: #0a0a0a;
    border: 2px solid #333;
    border-radius: 0;
    color: #fff;
    /* Font display P5UIBold huruf-kapital-semua bagus buat judul/tombol
       pendek, tapi bikin kalimat opsi jawaban yang panjang susah dibaca —
       jadi opsi jawaban dipakein font biasa yang lebih nyaman dibaca. */
    font-family: "Segoe UI", "Inter", system-ui, -apple-system, sans-serif;
    font-weight: 500;
    letter-spacing: normal;
    text-transform: none;
    transition: border-color 0.12s, background 0.12s, transform 0.08s;
    position: relative;
    overflow: hidden;
  }
  body.p5 .options .option::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: #ff0022;
    transform: scaleY(0);
    transition: transform 0.1s;
    transform-origin: bottom;
  }
  body.p5 .options .option:hover:not(.locked) {
    border-color: #ff0022;
    background: #ff002212;
  }
  body.p5 .options .option:hover:not(.locked)::before {
    transform: scaleY(1);
  }
  /* benar = kuning mustard, salah = merah tua, opsi yang gak kepilih
     dipudarkan & dijadiin biru tua gelap. */
  body.p5 .options .option.correct {
    background: #ffce1b26;
    border-color: #ffce1b;
    border-left-width: 4px;
  }
  body.p5 .options .option.wrong {
    background: #80051730;
    border-color: #800517;
    border-left-width: 4px;
    box-shadow: 3px 3px 0 #80051744;
  }
  body.p5 .options .option.faded {
    background: #10162e;
    border-color: #1c2650;
    color: #6a739c;
    opacity: 0.55;
  }
  /* Tiap opsi punya potongan sudut & rotasi sendiri — bukan kotak seragam.
     Cut depth kecil (4-9px) biar teks di dalam gak ke-crop. */
  body.p5 .options .option:nth-child(5n+1) {
    clip-path: polygon(9px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 14px) 100%, 0 100%, 0 4px);
    transform: rotate(-0.9deg) translateX(-3px);
  }
  body.p5 .options .option:nth-child(5n+2) {
    clip-path: polygon(0 5px, 5px 0, 100% 0, 100% calc(100% - 9px), calc(100% - 6px) 100%, 3px 100%);
    transform: rotate(1.1deg) translateX(4px);
  }
  body.p5 .options .option:nth-child(5n+3) {
    clip-path: polygon(4px 0, calc(100% - 3px) 0, 100% 8px, 100% 100%, 11px 100%, 0 calc(100% - 5px));
    transform: rotate(-1.4deg) translateX(-2px);
  }
  body.p5 .options .option:nth-child(5n+4) {
    clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 5px, 100% 100%, 6px 100%, 0 calc(100% - 3px));
    transform: rotate(0.7deg) translateX(5px);
  }
  body.p5 .options .option:nth-child(5n) {
    clip-path: polygon(7px 0, 100% 3px, 100% 100%, calc(100% - 4px) 100%, 0 calc(100% - 7px), 0 9px);
    transform: rotate(-0.4deg) translateX(-4px);
  }
  /* Hover: geser dikit TANPA nge-flatten rotasi masing-masing opsi */
  body.p5 .options .option:nth-child(5n+1):hover:not(.locked) { transform: rotate(-0.9deg) translateX(0px); }
  body.p5 .options .option:nth-child(5n+2):hover:not(.locked) { transform: rotate(1.1deg) translateX(7px); }
  body.p5 .options .option:nth-child(5n+3):hover:not(.locked) { transform: rotate(-1.4deg) translateX(1px); }
  body.p5 .options .option:nth-child(5n+4):hover:not(.locked) { transform: rotate(0.7deg) translateX(8px); }
  body.p5 .options .option:nth-child(5n):hover:not(.locked)   { transform: rotate(-0.4deg) translateX(-1px); }
  body.p5 .letterBadge.correct {
    background: #2e4d80;
    color: #fff;
    border-radius: 0;
  }
  body.p5 .letterBadge.wrong {
    background: #ff0022;
    color: #fff;
    border-radius: 0;
  }

  /* ── doneBanner: P5 all-clear style ── */
  body.p5 .doneBanner {
    background: #ff0022;
    border: none;
    border-radius: 0;
    border-left: 6px solid #fff;
  }
  body.p5 .doneBanner .title { color: #fff; font-family: "P5UIBold", "Bebas Neue", sans-serif; }
  body.p5 .doneBanner .sub { color: rgba(255,255,255,0.85); }

  /* ── Score hero ── */
  body.p5 .scoreHero {
    background: #000;
    border: 2px solid #ff0022;
    border-radius: 0;
    box-shadow: 6px 6px 0 #ff002266;
  }
  body.p5 .scoreHero .pct { color: #ff0022; text-shadow: 3px 3px 0 #fff; }
  body.p5 .scoreHero .gradeLabel { color: #fff; }

  /* ── Settings card: theme toggle buttons ── */
  body.p5 .themeModeOption {
    border-radius: 0;
    border: 2px solid #333;
    background: #0a0a0a;
    font-family: "P5UIBold", "Bebas Neue", sans-serif;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    transform: skewX(-4deg);
  }
  body.p5 .themeModeOption.active {
    background: #ff0022;
    border-color: #ff0022;
    color: #fff;
    box-shadow: 3px 3px 0 #88001166;
  }
  body.p5 .themeModeToggle {
    border-radius: 0;
    background: #000;
    border: 2px solid #ff0022;
    transform: skewX(-4deg);
  }

  /* ── Package picker items: P5 menu style ── */
  body.p5 .categoryHeader {
    border-radius: 0;
    font-family: "P5UIBold", "Bebas Neue", sans-serif;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    border-left: 4px solid transparent;
  }
  body.p5 .categoryHeader:hover,
  body.p5 .categoryHeader.open {
    background: #ff002215;
    border-left-color: #ff0022;
  }
  body.p5 .packageItem {
    border-radius: 0;
    border-top: 1px solid #ff002220;
    padding-left: 24px;
    position: relative;
    font-family: "P5UIBold", "Bebas Neue", sans-serif;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    font-size: 0.8rem;
  }
  body.p5 .packageItem:hover {
    background: #ff002215;
  }
  body.p5 .packageItem {
    overflow: hidden;
  }
  body.p5 .packageItem.active {
    background: #ff002225;
    border-left: 4px solid #ff0022;
    position: relative;
  }
  body.p5 .packageItem.active::after {
    content: '';
    position: absolute;
    inset: 0;
    background: #ff0022;
    mix-blend-mode: difference;
    pointer-events: none;
    z-index: 0;
  }
  body.p5 .packageItem.active > * {
    position: relative;
    z-index: 1;
  }
  body.p5 .packageItem.active .pkgTitle::before {
    content: "▶  ";
    color: inherit;
  }

  /* ── pkgSwitchBtn ── */
  body.p5 .pkgSwitchBtn {
    border-radius: 0;
    border: 2px solid #ff002244;
    font-family: "P5UIBold", "Bebas Neue", sans-serif;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    transform: skewX(-4deg);
  }
  body.p5 .pkgSwitchBtn:hover {
    border-color: #ff0022;
    background: #ff002215;
    color: #ff0022;
  }

  /* ── resetBtn ── */
  body.p5 .resetBtn {
    border-radius: 0;
    border: 2px solid #333;
    font-family: "P5UIBold", "Bebas Neue", sans-serif;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    transform: skewX(-4deg);
  }

  /* ── Volume slider: P5UIBold thumb ── */
  body.p5 .volumeSlider {
    border-radius: 0;
    background: #222;
  }
  body.p5 .volumeSlider::-webkit-slider-thumb {
    border-radius: 0;
    background: #ff0022;
    border: 2px solid #fff;
    transform: rotate(45deg);
  }
  body.p5 .volumeSlider::-moz-range-thumb {
    border-radius: 0;
    background: #ff0022;
    border: 2px solid #fff;
    transform: rotate(45deg);
  }

  /* ── Scrollbar: p5-scrollbar style ── */
  body.p5 ::-webkit-scrollbar { width: 6px; height: 6px; background: transparent; }
  body.p5 ::-webkit-scrollbar-thumb { background: #ff0022; }
  body.p5 ::-webkit-scrollbar-corner { display: none; }

  /* ── "Polygon-wiggle" on package select (p5-ui title.scss bgBlue/bgRed) ── */
  body.p5 .packageItem { overflow: visible; }
  body.p5 .packageItem.p5WiggleSelect::before,
  body.p5 .packageItem.p5WiggleSelect::after {
    content: "";
    position: absolute;
    top: -10%; left: -10%; width: 120%; height: 120%;
    z-index: -1;
    pointer-events: none;
  }
  body.p5 .packageItem.p5WiggleSelect::before {
    background-color: #1cfeff;
    animation: p5WiggleBlue 0.48s ease-out 1;
  }
  body.p5 .packageItem.p5WiggleSelect::after {
    mix-blend-mode: screen;
    background-color: #ff0022;
    animation: p5WiggleRed 0.48s ease-out 1;
  }
  @keyframes p5WiggleBlue {
    0%   { top: 6%;  transform: skew(-30deg, -2deg) scale(0.7); }
    20%  { top: 3%;  transform: skew(45deg, 4deg) scale(0.8); }
    40%  { top: -2%; transform: skew(-20deg, -2deg) scale(0.9); }
    60%  { top: -4%; transform: skew(20deg, 2deg) scale(1); }
    80%  { top: 3%;  transform: skew(-45deg, -4deg) scale(0.85); }
    100% { top: 0;   transform: skew(0deg, 0deg) scale(1); opacity: 0; }
  }
  @keyframes p5WiggleRed {
    0%   { top: -4%; transform: skew(45deg, 4deg) scale(1); }
    20%  { top: -1%; transform: skew(-30deg, -3deg) scale(0.9); }
    40%  { top: 2%;  transform: skew(60deg, 6deg) scale(0.75); }
    60%  { top: 3%;  transform: skew(-20deg, -2deg) scale(0.7); }
    80%  { top: -2%; transform: skew(30deg, 3deg) scale(0.85); }
    100% { top: 0;   transform: skew(0deg, 0deg) scale(1); opacity: 0; }
  }

  /* ── sectionLabel: gaya p5-divider ── */
  body.p5 .sectionLabel {
    position: relative;
    font-family: "P5UIBold", "Bebas Neue", sans-serif;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #fff;
    padding-bottom: 6px;
    margin-bottom: 12px;
  }
  body.p5 .sectionLabel::after {
    content: "";
    position: absolute;
    bottom: 0; left: 0;
    width: 100%; height: 4px;
    background: #ff0022;
    border-radius: 2px;
  }

  /* ── Sword: nusuk jawaban yang dipilih di P5 mode ──
       Posisi & animasinya di-drive JS via Web Animations API (elemen.animate()),
       BUKAN class+@keyframes lagi — supaya bisa retarget X/Y & sudut tiap klik,
       dan supaya replay-nya gak macet kalau jawaban berikutnya diklik cepat
       (animate() selalu bikin instance baru, animasi lama di-cancel eksplisit
       di JS, jadi gak ada lagi timer nyangkut yang bikin "sekali doang muncul").
       transform-origin di taruh persis di UJUNG mata pedang (bukan gagang),
       jadi titik itu yang "menancap" tepat di jawaban. */
  .p5-sword-overlay {
    position: fixed;
    left: 0;
    top: 0;
    height: 150px;
    width: auto;
    pointer-events: none;
    z-index: 9999;
    opacity: 0;
    transform-origin: 52% 99%;
    /* Gambar sword-nya sendiri banyak area hitam pekat, jadi kalau cuma
       ditaruh polos di atas background gelap dia bakal ke-camo (ini bug
       yang dilaporin). Fix-nya: kasih "aura" putih+merah nempel di siluet
       lewat numpuk beberapa drop-shadow blur kecil sampai besar — hasilnya
       pedangnya jadi kebungkus glow terang, jelas kelihatan di background
       hitam apa pun, sekalian nambah kesan "flashy" ala P5. */
    filter:
      drop-shadow(0 0 2px #fff)
      drop-shadow(0 0 5px #fff)
      drop-shadow(0 0 12px #ff0022)
      drop-shadow(0 0 24px #ff0022)
      drop-shadow(3px 4px 2px rgba(0,0,0,0.65));
  }

  /* ── Impact flash: ledakan cahaya sekilas pas ujung pedang "nancep" ──
       Elemen terpisah dari sword-nya sendiri supaya efeknya bisa nyala/mati
       independen dari animasi translate/rotate si pedang. */
  .p5-sword-flash {
    position: fixed;
    left: 0;
    top: 0;
    width: 130px;
    height: 130px;
    margin-left: -65px;
    margin-top: -65px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 9998;
    opacity: 0;
    background: radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(255,0,34,0.65) 32%, rgba(255,0,34,0) 72%);
  }

  /* ── Notification banner: hidden by default, only shown in P5 mode ── */
  .p5Notif {
    display: none;
  }

  /* ── Notification banner (correct/wrong): pakai artwork spanduk sobek ala
       P5 langsung dari gambar CLEAR/FAILED sebagai background — semua
       teksnya (nama, CLEAR/FAILED) sudah baked-in di gambarnya sendiri,
       jadi elemen ini murni bingkai + posisi + efek glow, tanpa overlay
       teks apapun. Aspect-ratio dikunci 1223:344 sesuai artwork aslinya. ── */
  body.p5 .p5Notif {
    display: block;
    position: fixed;
    top: clamp(52px, 12vw, 80px); left: -460px;
    width: min(400px, calc(100vw - 32px));
    aspect-ratio: 1223 / 344;
    background-repeat: no-repeat;
    background-position: center;
    background-size: 100% 100%;
    border: none;
    border-radius: 0;
    z-index: 9000;
    box-shadow: none;
    filter: drop-shadow(3px 5px 2px rgba(0,0,0,0.5));
    transition: left 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s;
    pointer-events: none;
  }
  body.p5 .p5Notif.show { left: 16px; }

  /* ── Timer circle: P5 style ── */
  body.p5 .timerCircle {
    border-radius: 0 !important;
    transform: rotate(45deg);
    border-color: #ff0022 !important;
  }
  body.p5 .timerText {
    transform: rotate(-45deg);
    font-family: "P5UIBold", "Bebas Neue", sans-serif;
    font-weight: 700;
    color: #ff0022 !important;
  }

  /* ── shuffle btn ── */
  body.p5 .shuffleBtn {
    border-radius: 0;
    border: 2px solid #ff002244;
    font-family: "P5UIBold", "Bebas Neue", sans-serif;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    transform: skewX(-4deg);
  }
  body.p5 .shuffleBtn.active {
    background: #ff0022;
    color: #fff;
    border-color: #ff0022;
    box-shadow: 3px 3px 0 #88001166;
  }

  /* ── muteBtn ── */
  body.p5 .muteBtn {
    border-radius: 0;
    border: 2px solid #333;
    transform: skewX(-4deg);
  }
  body.p5 .muteBtn.on {
    background: #ff0022;
    color: #fff;
    border-color: #ff0022;
    box-shadow: 3px 3px 0 #88001166;
  }

  /* ── hideToggleBtn ── */
  body.p5 .hideToggleBtn {
    border-radius: 0;
    border: 2px solid #333;
    transform: skewX(-4deg);
  }
  body.p5 .hideToggleBtn.active {
    background: #ff002215;
    border-color: #ff0022;
    color: #ff0022;
  }

  /* ── pickerCloseBtn ── */
  body.p5 .pickerCloseBtn {
    border-radius: 0;
    border: 2px solid #ff002244;
    font-family: "P5UIBold", "Bebas Neue", sans-serif;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    transform: skewX(-2deg);
    color: #ff0022;
  }
  body.p5 .pickerCloseBtn:hover {
    background: #ff0022;
    color: #fff;
    border-color: #ff0022;
    box-shadow: 4px 4px 0 #88001166;
  }

  /* ── statBox, distBar ── */
  body.p5 .statBox {
    border-radius: 0;
    border: 2px solid #ff002244 !important;
    background: #000 !important;
    box-shadow: 3px 3px 0 #ff002233;
  }
  body.p5 .progressTrack { border-radius: 0; }
  body.p5 .distBar { border-radius: 0; }

  /* ── qCard: ── */
  body.p5 .qCard {
    border-left: 4px solid #ff0022;
  }

  /* ── Lencana huruf pilihan ganda dipaksa ngikutin skema warna opsi
       jawaban yang baru (benar = mustard, salah = merah tua) — background
       gradasinya di-override full di sini + teksnya disesuaikan biar
       tetap kebaca (gelap di atas mustard yang terang, putih di atas
       merah tua yang gelap). ── */
  body.p5 .letter.correct {
    background: linear-gradient(135deg, #ffce1b, #cc9e00);
    color: #3a2600;
  }
  body.p5 .letter.wrong {
    background: linear-gradient(135deg, #800517, #58030f);
    color: #fff;
  }

  /* ── imgBadge ── */
  body.p5 .imgBadge {
    color: #1cfeff;
    font-family: "P5UIBold", sans-serif;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    font-size: 0.68rem;
  }

  /* ── Ransom/cutout letter effect ─────────────────────────────────────
     Used on section labels & category names in P5 mode.
     JS wraps each char in <span class="p5rc">, then nth-child CSS
     puts a red polygon behind specific chars, inverting their color.
     mix-blend-mode:difference = automatic invert without knowing bg color.
     No animation — static, like cut-out newspaper letters.
  ── */
  body.p5 .p5-ransom { display: inline; }
  body.p5 .p5-ransom .p5rc {
    display: inline-block;
    position: relative;
    /* tight tracking within word */
    letter-spacing: -0.01em;
  }
  /* Every ~3rd char gets the red cut-out block */
  body.p5 .p5-ransom .p5rc.p5rc-inv {
    background: #ff0022;
    color: #000;
    mix-blend-mode: normal;
    padding: 0 1px;
    margin: 0 -0.5px;
    line-height: 1;
  }
  /* Slight tilt variation — more organic, less mechanical */
  body.p5 .p5-ransom .p5rc.p5rc-inv:nth-child(3n+1) { transform: rotate(-2deg) skewX(-3deg); }
  body.p5 .p5-ransom .p5rc.p5rc-inv:nth-child(3n+2) { transform: rotate(1.5deg) skewX(2deg); }
  body.p5 .p5-ransom .p5rc.p5rc-inv:nth-child(3n)   { transform: rotate(-1deg); }
  /* Space chars: no background, just spacing */
  body.p5 .p5-ransom .p5rc-space {
    display: inline-block;
    width: 0.35em;
  }
  /* Non-inverted chars stay white, slight random tilt */
  body.p5 .p5-ransom .p5rc:not(.p5rc-inv):nth-child(5n+2) { transform: rotate(0.8deg); }
  body.p5 .p5-ransom .p5rc:not(.p5rc-inv):nth-child(7n+3) { transform: rotate(-0.6deg); }

  /* ── Asimetri doodle: potongan 4-sudut + rotasi + geser kecil, beda
       tiap elemen dalam satu baris/list — supaya dari jauh KELIHATAN
       gak seragam, bukan cuma "kotak dengan 1 sudut kepotong". ── */
  body.p5 .statBox:nth-child(3n+1) {
    clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 5px), calc(100% - 8px) 100%, 0 100%, 0 3px);
    transform: rotate(-2.4deg) translateY(-2px);
  }
  body.p5 .statBox:nth-child(3n+2) {
    clip-path: polygon(0 4px, 4px 0, 100% 0, 100% calc(100% - 7px), calc(100% - 5px) 100%, 0 100%);
    transform: rotate(1.8deg) translateY(3px);
  }
  body.p5 .statBox:nth-child(3n) {
    clip-path: polygon(3px 0, calc(100% - 5px) 0, 100% 6px, 100% 100%, 6px 100%, 0 calc(100% - 4px));
    transform: rotate(-0.9deg) translateY(-1px);
  }
  body.p5 .pillBtn:nth-child(3n+1) { transform: skewX(-4deg) rotate(-2.6deg) translateY(-1px); }
  body.p5 .pillBtn:nth-child(3n+2) { transform: skewX(-3deg) rotate(2.1deg) translateY(2px); }
  body.p5 .pillBtn:nth-child(3n)   { transform: skewX(-5deg) rotate(-1.2deg); }
  body.p5 .categoryGroup:nth-child(4n+1) {
    clip-path: polygon(8px 0, calc(100% - 10px) 0, 100% 8px, 100% 100%, 0 100%, 0 5px);
    transform: rotate(-0.5deg);
  }
  body.p5 .categoryGroup:nth-child(4n+2) {
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 8px), calc(100% - 14px) 100%, 5px 100%, 0 calc(100% - 3px));
    transform: rotate(0.6deg);
  }
  body.p5 .categoryGroup:nth-child(4n+3) {
    clip-path: polygon(4px 0, 100% 0, 100% 100%, 12px 100%, 0 calc(100% - 9px), 0 6px);
    transform: rotate(-0.3deg);
  }
  body.p5 .categoryGroup:nth-child(4n) {
    clip-path: polygon(0 5px, 6px 0, calc(100% - 4px) 0, 100% 8px, 100% 100%, 0 100%);
    transform: rotate(0.8deg);
  }
  /* Item paket satu-satu punya kemiringan halus sendiri (list vertikal,
     jadi rotasi kecil aja biar teks tetap kebaca dan gak numpuk). */
  body.p5 .packageItem:nth-child(4n+1) { transform: rotate(-0.45deg); }
  body.p5 .packageItem:nth-child(4n+2) { transform: rotate(0.35deg); }
  body.p5 .packageItem:nth-child(4n+3) { transform: rotate(-0.25deg); }
  body.p5 .packageItem:nth-child(4n)   { transform: rotate(0.4deg); }
  /* Scorecard percent: massive P5 font, red with white outline */
  body.p5 .scoreHero .pct {
    color: #fff;
    -webkit-text-stroke: 2px #ff0022;
    text-shadow: 4px 4px 0 #ff0022;
  }
  /* doneBanner: potongan 4-sudut + rotasi kecil */
  body.p5 .doneBanner {
    clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 20px) 100%, 0 100%, 0 5px);
    transform: rotate(-0.4deg);
  }
  /* qCard: 4 variasi potongan + rotasi, muter tiap kartu di list */
  body.p5 .qList .qCard:nth-child(4n+1) {
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 18px), calc(100% - 26px) 100%, 0 100%, 0 6px);
    transform: rotate(-0.6deg);
  }
  body.p5 .qList .qCard:nth-child(4n+2) {
    clip-path: polygon(18px 0, 100% 0, 100% 100%, 8px 100%, 0 calc(100% - 22px), 0 10px);
    transform: rotate(0.5deg);
  }
  body.p5 .qList .qCard:nth-child(4n+3) {
    clip-path: polygon(6px 0, calc(100% - 8px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 6px));
    transform: rotate(-0.3deg);
  }
  body.p5 .qList .qCard:nth-child(4n) {
    clip-path: polygon(0 8px, 10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 18px) 100%, 0 100%);
    transform: rotate(0.45deg);
  }
  /* Explanation block: potongan sudut kiri, gak dirotasi (blok teks panjang) */
  body.p5 .explanation {
    clip-path: polygon(9px 0, 100% 0, 100% 100%, 4px 100%, 0 calc(100% - 6px), 0 9px);
    border-left: 4px solid #ff0022;
    background: #0f0000;
    padding: 12px 14px 12px 16px;
    margin-top: 12px;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(600px 320px at 12% -8%, #3a2a7a55, transparent 60%),
      radial-gradient(560px 340px at 110% 12%, #ff5d8f22, transparent 55%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text-secondary);
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: "JetBrains Mono", monospace; }
  .wrap { width: 100%; max-width: 720px; margin: 0 auto; padding: 0 16px 60px; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  }

  /* ── Sticky header ── */
  .headerZone { position: sticky; top: 0; z-index: 50; }
  .headerZone::before {
    content: ""; display: block; height: 3px; width: 100%;
    background: linear-gradient(90deg, var(--accent2), var(--accent) 45%, var(--blue) 100%);
  }
  .headerCollapse { overflow: hidden; transition: max-height 0.35s cubic-bezier(0.4,0,0.2,1); max-height: 170px; }
  .headerCollapse.hidden { max-height: 0; }
  header {
    background: var(--card);
    border-bottom: 1px solid var(--border-light);
    padding: 14px 0;
  }
  .headerInner { max-width: 720px; margin: 0 auto; padding: 0 16px; }
  .titleRow { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px; }
  h1 {
    font-family: "Fredoka", "Plus Jakarta Sans", sans-serif;
    color: var(--accent);
    font-size: clamp(1.15rem, 4vw, 1.65rem);
    font-weight: 700;
    line-height: 1.2;
    margin: 0;
    letter-spacing: 0.01em;
  }
  .tracker { text-align: right; min-width: 74px; margin-left: auto; }
  .tracker .count { font-size: 0.95rem; font-weight: 700; color: var(--accent); }
  .tracker .sub { color: var(--muted2); font-size: 0.66rem; line-height: 1.3; }
  .tracker .sub .ok { color: var(--correct); font-weight: 700; }

  .modeBar {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 10px 0;
  }
  .modeBarInner {
    max-width: 720px; margin: 0 auto; padding: 0 16px;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .pillBtn {
    padding: 7px 16px;
    border-radius: 999px;
    font-size: 0.79rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.15s, background 0.15s, color 0.15s, box-shadow 0.15s;
    background: transparent;
    color: var(--muted);
    border: 1.5px solid var(--border);
  }
  .pillBtn:hover { border-color: var(--muted3); color: var(--text-secondary); }
  .pillBtn.active {
    background: linear-gradient(135deg, var(--accent), var(--accent-strong));
    color: #251500;
    border-color: transparent;
    box-shadow: 0 2px 0 rgba(0,0,0,0.25), 0 0 0 3px var(--accent-soft);
  }
  .pillBtn:active { transform: scale(0.96); }
  .resetBtn {
    margin-left: auto;
    display: flex; align-items: center; gap: 4px;
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--muted2);
    background: none;
    border: 1.5px solid var(--border);
    cursor: pointer;
    padding: 5px 12px;
    border-radius: 999px;
    transition: all 0.15s;
  }
  .resetBtn:hover { color: var(--wrong); border-color: var(--wrong-strong); }

  .hideToggleBtn {
    display: flex; align-items: center; justify-content: center;
    background: none;
    cursor: pointer;
    width: 32px; height: 30px;
    padding: 0;
    border-radius: 999px;
    transition: all 0.2s;
    flex-shrink: 0;
    border: 1.5px solid var(--border);
    color: var(--muted2);
  }
  .hideToggleBtn.active { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .hideToggleBtn .arrow { display: inline-block; transition: transform 0.3s; font-size: 0.85rem; }
  .hideToggleBtn.active .arrow { transform: rotate(180deg); }

  /* Collapsed state: no bar at all, just the floating triangle button */
  .collapsedToggleWrap { display: inline-block; padding: 6px 0 6px 16px; }

  .muteBtn {
    background: none;
    border: 1.5px solid var(--border);
    border-radius: 999px;
    padding: 5px 10px;
    cursor: pointer;
    color: var(--muted2);
    font-size: 1rem;
    line-height: 1;
    flex-shrink: 0;
    transition: all 0.15s;
  }
  .muteBtn.on { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }

  /* ── Filter bar ── */
  .filterBar {
    border-bottom: 1px solid var(--border-light);
    background: var(--bg-alt);
    padding: 10px 0;
  }
  .filterInner {
    max-width: 720px; margin: 0 auto; padding: 0 16px;
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  }
  .shuffleBtn {
    display: flex; align-items: center; gap: 4px;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 0.68rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    background: transparent;
    color: var(--muted);
    border: 1.5px solid rgba(255,255,255,0.12);
  }
  .shuffleBtn.active { background: var(--accent2); color: #2a0416; border-color: transparent; }

  /* ── Tracker card (progress) ── */
  main { max-width: 720px; margin: 0 auto; padding: 20px 16px; }
  .progressCard {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 14px 16px;
    margin-bottom: 16px;
    box-shadow: var(--shadow-card);
  }
  .progressTop { display: flex; align-items: center; justify-content: space-between; margin-bottom: 9px; flex-wrap: wrap; gap: 8px; }
  .progressTop .left { font-size: 0.82rem; color: var(--muted); }
  .progressTop .left .num { color: var(--accent); font-weight: 700; }
  .progressTop .left .num.total { color: var(--text-secondary); }
  .statChip { display: flex; align-items: center; gap: 5px; font-size: 0.78rem; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .progressTrack { background: var(--border-light); border-radius: 999px; height: 8px; overflow: hidden; }
  .progressFill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent2), var(--accent)); transition: width 0.5s cubic-bezier(0.34,1.56,0.64,1); }

  .doneBanner {
    background: linear-gradient(120deg, var(--accent-soft), var(--accent2-soft));
    border: 1.5px solid var(--accent);
    border-radius: var(--radius-md);
    padding: 14px 16px;
    margin-bottom: 20px;
    display: flex; align-items: center; gap: 10px;
    animation: popIn 0.35s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  .doneBanner .title { color: var(--accent); font-weight: 700; font-size: 0.9rem; font-family: "Fredoka", sans-serif; }
  .doneBanner .sub { color: var(--text-secondary); font-size: 0.82rem; }

  /* ── Question card (continuous scroll list) ── */
  .qList { display: flex; flex-direction: column; gap: 20px; }
  .qCard {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 20px;
    box-shadow: var(--shadow-card);
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes popIn { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
  .qMeta { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .imgBadge { display: flex; align-items: center; gap: 4px; font-size: 0.72rem; color: var(--blue); font-weight: 600; }
  .qText { color: var(--text); font-size: 0.9rem; line-height: 1.65; margin: 0 0 16px; }
  .qNum { font-family: "JetBrains Mono", monospace; color: var(--accent); font-weight: 700; margin-right: 6px; }
  .qImg, .exImg {
    width: 100%; object-fit: contain; max-height: 280px;
    background: #fff; display: block; border-radius: var(--radius-sm);
    border: 1px solid var(--border); margin-bottom: 14px;
  }

  .options { display: flex; flex-direction: column; gap: 9px; }
  .option {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 12px 14px;
    border-radius: var(--radius-sm);
    background: var(--border-light);
    border: 1.5px solid var(--border);
    border-left-width: 4px;
    color: var(--text-secondary);
    cursor: pointer;
    transition: transform 0.12s, border-color 0.15s, background 0.15s;
    text-align: left;
    width: 100%;
  }
  .option:hover:not(.locked) { border-color: var(--accent); background: var(--accent-soft); transform: translateX(2px); }
  .option:active:not(.locked) { transform: scale(0.985); }
  .option.locked { cursor: default; }
  .option.selected { border-color: var(--accent); background: var(--accent-soft); }
  .option.correct {
    background: rgba(23,180,118,0.16); border-color: var(--correct-strong); color: var(--tint-correct-text);
    animation: correctPop 0.35s ease both;
  }
  .option.wrong {
    background: rgba(229,66,58,0.16); border-color: var(--wrong-strong); color: var(--tint-wrong-text);
    animation: wrongShake 0.4s ease both;
  }
  .option.faded { background: var(--card); border-color: var(--border-light); color: var(--muted3); opacity: 0.7; }
  @keyframes correctPop { 0% { transform: scale(0.97); } 55% { transform: scale(1.015); } 100% { transform: scale(1); } }
  @keyframes wrongShake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(3px); } }
  .letter {
    font-family: "JetBrains Mono", monospace;
    font-weight: 700; font-size: 11px;
    width: 26px; height: 26px; border-radius: 50%;
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    border: 1.5px solid var(--border); color: var(--muted);
    margin-top: 1px; transition: all 0.15s;
  }
  .letter.correct { background: linear-gradient(135deg, var(--correct), var(--correct-strong)); border: none; color: #04281a; }
  .letter.wrong { background: linear-gradient(135deg, var(--wrong), var(--wrong-strong)); border: none; color: #2c0503; }
  .letter.faded { border-color: var(--border-light); color: var(--muted3); }
  .optText { font-size: 0.84rem; line-height: 1.55; flex: 1; }
  .icon { flex-shrink: 0; margin-top: 2px; font-size: 0.9rem; }
  .icon.ok { color: var(--correct); }
  .icon.no { color: var(--wrong); }

  .skipNote {
    display: flex; align-items: center; gap: 6px;
    color: var(--muted); font-size: 0.78rem;
    margin-top: 10px;
  }

  /* ── Soal Rusak — tap-to-reveal card ── */
  .brokenCard {
    background: var(--card);
    border: 1.5px dashed var(--muted3);
    border-radius: var(--radius-lg);
    padding: 20px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    transition: border-color 0.15s, background 0.15s;
  }
  .brokenCard:hover { border-color: var(--accent); background: var(--accent-soft); }
  .brokenCard .brokenMeta {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 10px; flex-wrap: wrap;
  }
  .brokenBadge {
    font-size: 0.68rem; font-weight: 700; letter-spacing: 0.06em;
    text-transform: uppercase; padding: 3px 9px; border-radius: 999px;
    background: rgba(229,66,58,0.18); color: var(--tint-wrong-text);
    border: 1px solid rgba(229,66,58,0.4);
  }
  .tapHint {
    font-size: 0.68rem; color: var(--muted3);
  }
  .brokenCard .brokenQ {
    color: var(--text); font-size: 0.9rem; line-height: 1.65; margin: 0;
  }
  .brokenCard .brokenNum {
    font-family: "JetBrains Mono", monospace; color: var(--accent);
    font-weight: 700; margin-right: 6px;
  }
  .brokenReveal {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px dashed var(--border);
  }
  .brokenReveal .tag {
    display: flex; align-items: center; gap: 6px;
    color: var(--blue); font-weight: 700; font-size: 0.78rem; margin-bottom: 8px;
  }
  .brokenReveal .noImg {
    color: var(--muted2); font-size: 0.78rem; font-style: italic;
  }

  .explanation {
    background: rgba(108,201,255,0.1);
    border: 1px solid rgba(108,201,255,0.33);
    border-radius: var(--radius-sm);
    padding: 14px;
    margin-top: 14px;
  }
  .explanation .tag {
    display: flex; align-items: center; gap: 6px;
    color: var(--blue); font-weight: 700; font-size: 0.78rem; margin-bottom: 6px;
  }
  .explanation p { color: var(--text-secondary); font-size: 0.82rem; line-height: 1.65; margin: 0; }

  /* ── Load more (Mode Latihan pagination) ── */
  .loadMoreBtn {
    width: 100%; margin-top: 20px; padding: 14px;
    background: var(--card); border: 1.5px solid var(--border); color: var(--accent);
    font-weight: 700; font-size: 0.86rem; border-radius: var(--radius-md); cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: all 0.15s;
  }
  .loadMoreBtn:hover { border-color: var(--accent); background: var(--accent-soft); }
  .loadMoreBtn:active { transform: scale(0.98); }

  /* ── Tentamen: difficulty selector ── */
  .sectionLabel { font-size: 0.72rem; color: var(--muted2); margin-bottom: 10px; font-weight: 700; letter-spacing: 0.03em; }
  .diffGrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .diffCard {
    display: flex; flex-direction: column; align-items: flex-start; gap: 8px;
    padding: 18px 16px; border-radius: var(--radius-lg); border: 1.5px solid var(--border);
    background: var(--card); cursor: pointer; transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
    text-align: left; min-height: 116px; box-shadow: var(--shadow-card);
  }
  .diffCard:hover { transform: translateY(-2px); }
  .diffCard.active { border-width: 2px; box-shadow: 0 4px 0 rgba(10,6,26,0.55), 0 0 0 3px rgba(255,255,255,0.04); }
  .diffTop { display: flex; align-items: center; gap: 8px; }
  .diffEmoji { font-size: 1.7rem; line-height: 1; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.3)); }
  .diffLabel { font-weight: 700; font-size: 1.02rem; font-family: "Fredoka", sans-serif; }
  .diffDesc { font-size: 0.82rem; color: var(--muted); line-height: 1.4; }
  .diffTimer { font-family: "JetBrains Mono", monospace; font-size: 0.75rem; font-weight: 700; }

  .statsRow3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
  .statBox2 { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 14px; text-align: center; box-shadow: var(--shadow-card); }
  .statBox2 .val { font-family: "JetBrains Mono", monospace; color: var(--accent); font-size: 1.4rem; font-weight: 700; }
  .statBox2 .lbl { color: var(--muted2); font-size: 0.72rem; margin-top: 4px; }

  .startTentamenBtn {
    width: 100%; padding: 16px; color: #251500; font-weight: 700; font-size: 1.02rem;
    font-family: "Fredoka", sans-serif;
    border-radius: var(--radius-md); border: none; cursor: pointer; display: flex; align-items: center;
    justify-content: center; gap: 8px; transition: transform 0.12s, opacity 0.15s;
    box-shadow: 0 4px 0 rgba(0,0,0,0.28);
  }
  .startTentamenBtn:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
  .startTentamenBtn:hover:not(:disabled) { transform: translateY(-1px); }
  .startTentamenBtn:active:not(:disabled) { transform: translateY(1px); box-shadow: 0 2px 0 rgba(0,0,0,0.28); }

  /* ── Tentamen: running ── */
  .tentamenTop { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .tentamenTop .qOf { font-size: 0.78rem; color: var(--muted); }
  .dotsRow { display: flex; gap: 4px; align-items: center; }
  .dotItem { width: 8px; height: 8px; border-radius: 50%; background: var(--border-light); transition: all 0.2s; }
  .dotItem.done { background: var(--correct); }
  .dotItem.current { width: 18px; height: 8px; border-radius: 4px; background: var(--accent); }
  .dotsOverflow { color: var(--muted3); font-size: 0.65rem; margin-left: 2px; }

  .timerCard { background: var(--card); border: 1.5px solid var(--border); border-radius: var(--radius-md); padding: 14px 16px; margin-bottom: 16px; transition: border-color 0.3s; box-shadow: var(--shadow-card); }
  .timerCard.urgent { border-color: var(--wrong-strong); }
  .timerCard.timeoutFlash { animation: timeoutFlash 0.6s ease-in-out 3; }
  .timerTop { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .timerLabel { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; color: var(--muted); font-weight: 600; }
  .timerLabel.urgent { color: var(--wrong-strong); }
  .timerNum { font-family: "JetBrains Mono", monospace; font-size: 2.3rem; font-weight: 700; line-height: 1; }
  .timerNum.pulse { animation: timerPulse 0.75s ease-in-out infinite; }
  .timerTrack { background: var(--border-light); border-radius: 999px; height: 7px; overflow: hidden; }
  .timerFill { height: 100%; border-radius: 999px; transition: width 1s linear, background-color 0.3s; }

  @keyframes timerPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
  @keyframes timeoutFlash { 0%, 100% { background-color: transparent; } 50% { background-color: rgba(229, 66, 58, 0.1); } }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }

  .timeoutNotice {
    background: rgba(229,66,58,0.12); border: 1px solid rgba(229,66,58,0.3);
    border-radius: var(--radius-sm); padding: 10px 14px; margin-top: 14px;
    display: flex; align-items: center; gap: 8px;
    animation: slideDown 0.22s ease-out both;
  }
  .timeoutNotice span { color: var(--tint-wrong-text); font-size: 0.82rem; font-weight: 600; }

  .nextBtn {
    width: 100%; padding: 14px; background: linear-gradient(135deg, var(--accent), var(--accent-strong)); color: #251500;
    font-weight: 700; font-size: 0.96rem; font-family: "Fredoka", sans-serif;
    border-radius: var(--radius-md); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 7px;
    transition: transform 0.12s; margin-top: 14px;
    animation: slideDown 0.22s ease-out both;
    box-shadow: 0 4px 0 rgba(0,0,0,0.28);
  }
  .nextBtn:hover { transform: translateY(-1px); }
  .nextBtn:active { transform: translateY(1px); box-shadow: 0 2px 0 rgba(0,0,0,0.28); }

  /* ── Summary / hasil ── */
  .scoreHero {
    background:
      radial-gradient(220px 140px at 50% 0%, var(--accent-soft), transparent 70%),
      var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 30px 24px; margin-bottom: 14px; text-align: center;
    position: relative; overflow: hidden;
    box-shadow: var(--shadow-card);
  }
  .scoreHero .trophy { font-size: 2.4rem; margin-bottom: 8px; animation: trophyBounce 0.6s cubic-bezier(0.34,1.56,0.64,1) both; }
  .scoreHero .pct {
    font-family: "Fredoka", "Plus Jakarta Sans", sans-serif;
    font-size: clamp(3rem, 15vw, 4.6rem); font-weight: 700; line-height: 1;
    animation: popIn 0.45s 0.1s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  .scoreHero .gradeLabel { font-size: 0.92rem; font-weight: 700; margin-top: 6px; font-family: "Fredoka", sans-serif; }
  .scoreHero .subline { color: var(--muted2); font-size: 0.78rem; margin-top: 4px; }
  @keyframes trophyBounce {
    0% { transform: translateY(-14px) scale(0.6); opacity: 0; }
    60% { transform: translateY(2px) scale(1.08); opacity: 1; }
    100% { transform: translateY(0) scale(1); }
  }

  .statsGrid { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; margin-bottom: 14px; }
  .statsGrid.statsGrid3 { grid-template-columns: repeat(3,1fr); }
  .statBox { border-radius: var(--radius-md); padding: 14px; text-align: center; border: 1.5px solid; }
  .statBox .val { font-family: "JetBrains Mono", monospace; font-size: 1.65rem; font-weight: 700; }
  .statBox .lbl { font-size: 0.7rem; margin-top: 4px; opacity: 0.85; font-weight: 600; }

  .distBar { display: flex; height: 12px; border-radius: 999px; overflow: hidden; gap: 2px; }
  .distLegend { display: flex; justify-content: space-between; margin-top: 6px; font-size: 0.68rem; color: var(--muted2); font-weight: 600; }

  .restartBtn {
    width: 100%; padding: 15px;
    background: linear-gradient(135deg, var(--accent2), #ff3d7a); color: #2a0416;
    font-weight: 700; font-size: 1.02rem; font-family: "Fredoka", sans-serif;
    border-radius: var(--radius-md); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-bottom: 20px;
    transition: transform 0.12s;
    box-shadow: 0 4px 0 rgba(0,0,0,0.28);
  }
  .restartBtn:hover { transform: translateY(-1px); }
  .restartBtn:active { transform: translateY(1px); box-shadow: 0 2px 0 rgba(0,0,0,0.28); }

  .reviewLabel { font-size: 0.78rem; color: var(--muted2); margin-bottom: 12px; font-weight: 600; }
  .reviewList { display: flex; flex-direction: column; gap: 16px; }

  .empty { color: var(--muted2); text-align: center; margin-top: 60px; font-size: 0.9rem; }

  .quiz-fade-in { animation: fadeIn 0.28s ease-out both; }

  /* ── Pemilih paket soal (kategori) ── */
  .pkgSwitchBtn {
    display: flex; align-items: center; gap: 5px;
    background: none; border: 1.5px solid var(--border); color: var(--muted);
    font-size: 0.68rem; font-weight: 700; padding: 5px 11px; border-radius: 999px;
    cursor: pointer; transition: all 0.15s; margin-top: 4px;
  }
  .pkgSwitchBtn:hover { color: var(--accent); border-color: var(--accent); }
  h1.pkgTitleActive { font-size: clamp(1.05rem, 3.6vw, 1.45rem); }
  .pkgSubtitle { color: var(--muted2); font-size: 0.72rem; margin-top: 2px; font-weight: 600; }

  .pickerHeader { padding: 30px 0 18px; text-align: center; }
  .pickerHeader h1 { color: var(--accent); font-family: "Fredoka", sans-serif; font-size: clamp(1.4rem, 5vw, 2rem); margin: 0 0 6px; }
  .pickerSub { color: var(--muted2); font-size: 0.84rem; margin: 0; }

  .categoryList { display: flex; flex-direction: column; gap: 10px; padding-bottom: 20px; }
  .categoryGroup { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-card); }
  .categoryHeader {
    width: 100%; display: flex; align-items: center; gap: 10px;
    background: none; border: none; cursor: pointer; padding: 15px 16px;
    color: var(--text); text-align: left; transition: background 0.15s;
  }
  .categoryHeader:hover { background: var(--border-light); }
  .categoryHeader.open { background: var(--accent-soft); }
  .catName { font-weight: 700; font-size: 0.94rem; flex: 1; }
  .catMeta { color: var(--muted2); font-size: 0.72rem; font-weight: 600; }
  .catArrow { color: var(--accent); font-size: 0.7rem; transition: transform 0.2s; }

  .categoryBody { max-height: 0; overflow: hidden; transition: max-height 0.3s cubic-bezier(0.4,0,0.2,1); }
  .categoryBody.open { max-height: 2000px; }
  .packageItem {
    width: 100%; display: flex; flex-direction: column; gap: 2px;
    background: none; border: none; border-top: 1px solid var(--border-light);
    cursor: pointer; padding: 12px 16px 12px 28px; text-align: left; color: var(--text-secondary);
    transition: background 0.15s;
  }
  .packageItem:hover { background: var(--border-light); }
  .packageItem.active { background: var(--accent-soft); }
  .packageItem .pkgTitle { font-weight: 700; font-size: 0.87rem; color: var(--text); }
  .packageItem.active .pkgTitle::before { content: "\2713  "; color: var(--accent); }
  .packageItem .pkgMeta { color: var(--muted2); font-size: 0.7rem; }

  .pickerCloseBtn {
    width: 100%; padding: 13px; background: none; color: var(--muted);
    border: 1.5px solid var(--border); border-radius: var(--radius-md); cursor: pointer;
    font-weight: 600; font-size: 0.84rem; margin-top: 4px; transition: all 0.15s;
  }
  .pickerCloseBtn:hover { color: var(--text-secondary); border-color: var(--muted3); }

  /* ── Kartu Pengaturan (tema + volume) ── */
  .settingsCard {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-md);
    padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow-card);
  }
  .settingsRow {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 0; border-bottom: 1px solid var(--border-light);
  }
  .settingsRow.settingsRow-noBorder { border-bottom: none; padding-bottom: 2px; }
  .settingsRowText { display: flex; flex-direction: column; gap: 2px; }
  .settingsRowTitle { font-weight: 700; font-size: 0.88rem; color: var(--text); }
  .settingsRowDesc { font-size: 0.72rem; color: var(--muted2); }

  .themeModeToggle {
    flex-shrink: 0; width: 34px; height: 34px; border-radius: var(--radius-sm);
    background: var(--border-light); border: 1.5px solid var(--border); cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: background 0.2s, border-color 0.2s;
  }
  .themeModeToggle:hover { background: var(--accent-soft); border-color: var(--accent); }
  .themeModeChevron { display: inline-block; color: var(--text-secondary); transition: transform 0.2s ease; }
  .themeModeChevron.open { transform: rotate(180deg); }

  .themeModeOptions {
    display: flex; gap: 8px; flex-wrap: wrap; padding: 4px 0 14px;
    border-bottom: 1px solid var(--border-light);
  }
  .themeModeOption {
    display: flex; align-items: center; gap: 6px; padding: 8px 12px;
    border-radius: var(--radius-sm); border: 1.5px solid var(--border);
    background: var(--card-soft); color: var(--text-secondary); cursor: pointer;
    font-size: 0.82rem; font-weight: 700; transition: transform 0.15s ease, border-color 0.2s, background 0.2s;
  }
  .themeModeOption:hover { transform: translateY(-1px); border-color: var(--accent); }
  .themeModeOption.active {
    background: linear-gradient(135deg, var(--accent), var(--accent-strong));
    border-color: transparent; color: #fff;
  }
  .themeModeOptionIcon { font-size: 1rem; }

  .volumeSliderRow { display: flex; align-items: center; gap: 10px; padding-top: 4px; }
  .volumeIcon { font-size: 0.95rem; color: var(--muted2); flex-shrink: 0; }
  .volumeVal { font-size: 0.76rem; color: var(--accent); font-weight: 700; min-width: 34px; text-align: right; flex-shrink: 0; }
  .volumeSlider {
    flex: 1; appearance: none; -webkit-appearance: none; height: 6px; border-radius: 999px;
    background: var(--border-light); outline: none; cursor: pointer;
  }
  .volumeSlider::-webkit-slider-thumb {
    appearance: none; -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%;
    background: var(--accent); border: 2px solid var(--card); box-shadow: 0 0 0 1px var(--border);
    cursor: pointer;
  }
  .volumeSlider::-moz-range-thumb {
    width: 18px; height: 18px; border-radius: 50%; background: var(--accent);
    border: 2px solid var(--card); box-shadow: 0 0 0 1px var(--border); cursor: pointer;
  }
  .volumeSlider::-moz-range-track { background: var(--border-light); height: 6px; border-radius: 999px; }

  /* ── Password Gate ──────────────────────────────────────────────────── */
  #gate-overlay {
    position: fixed; inset: 0; z-index: 9999;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  #gate-overlay.hidden { display: none; }
  .gate-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px 32px;
    max-width: 380px; width: 100%;
    text-align: center;
  }
  .gate-logo {
    font-family: 'DM Serif Display', serif;
    font-size: 2rem;
    color: var(--text);
    margin-bottom: 6px;
  }
  .gate-logo span { color: var(--accent); }
  .gate-sub {
    font-size: 0.82rem;
    color: var(--muted);
    margin-bottom: 28px;
    letter-spacing: 0.03em;
  }
  .gate-label {
    display: block;
    font-size: 0.78rem;
    color: var(--muted);
    text-align: left;
    margin-bottom: 6px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .gate-input {
    width: 100%; box-sizing: border-box;
    background: var(--bg-alt);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 1rem;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    margin-bottom: 8px;
    outline: none;
    transition: border-color 0.15s;
  }
  .gate-input:focus { border-color: var(--accent); }
  .gate-input.error { border-color: var(--wrong); animation: shake 0.3s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
  .gate-err {
    font-size: 0.78rem;
    color: var(--wrong);
    min-height: 1em;
    margin-bottom: 16px;
    text-align: left;
  }
  .gate-btn {
    width: 100%;
    padding: 11px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .gate-btn:hover { opacity: 0.85; }
</style>
</head>

  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function escapeHtml(str) {
  return String(str ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}
function escapeAttr(str) { return escapeHtml(str); }

// ── Audio (benar/salah) ──────────────────────────────────────────────────
// File suara "benar" tinggal ditaruh di folder audio/benar/, dan file
// suara "salah" di audio/salah/ — nama file BEBAS (ga perlu diawali
// "benar"/"salah" atau dinomori urut). Daftar isi tiap folder di-generate
// ke audio/manifest.js lewat:
//     npm run audio-manifest
// (jalankan ulang tiap kali nambah/hapus/rename file di audio/benar/ atau
// audio/salah/). App tinggal baca window.AUDIO_MANIFEST dari file itu.
//
// BUG LAMA yang ini gantiin: penemuan file bernomor (benar1.mp3, dst)
// berhenti begitu ketemu SATU nomor yang bolong (mis. salah3.mp3 ga ada),
// jadi semua file sesudah nomor yang bolong itu (salah4..salah9) ga
// pernah ikut kedeteksi/keputer sama sekali. Manifest yang di-generate
// dari isi folder asli ga punya masalah "bolong nomor" ini.
// Coba load audio/manifest.js secara dinamis (non-blocking) — kalau 404,
// pool tetap kosong dan suara hanya tidak bunyi, halaman tidak crash.
let benarPool = [];
let salahPool = [];
function buildAudioPool(folder, fileNames) {
  return (fileNames || []).map((name) => new Audio(`./audio/${folder}/${name}`));
}
(function loadAudioManifest() {
  try {
    const s = document.createElement("script");
    s.src = "./audio/manifest.js";
    s.onload = () => {
      const m = window.AUDIO_MANIFEST || {};
      benarPool = buildAudioPool("benar", m.benar);
      salahPool = buildAudioPool("salah", m.salah);
      [...benarPool, ...salahPool].forEach((a) => { a.volume = volume; });
    };
    s.onerror = () => {
      console.warn("[audio] audio/manifest.js tidak ditemukan — suara benar/salah tidak akan bunyi. Jalankan 'npm run audio-manifest'.");
    };
    document.head.appendChild(s);
  } catch {
    console.warn("[audio] gagal load audio/manifest.js");
  }
})();

let isMuted = localStorage.getItem(MUTE_KEY) === "true";

// Volume (0..1) — terpisah dari mute on/off, diatur lewat kartu Pengaturan.
let volume = 1;
try {
  const rawVol = parseFloat(localStorage.getItem(VOLUME_KEY));
  if (!Number.isNaN(rawVol)) volume = Math.min(1, Math.max(0, rawVol));
} catch { /* noop */ }
[...benarPool, ...salahPool].forEach((a) => { a.volume = volume; });

// Audio yang lagi/baru saja diputar — dipakai buat berhentiin paksa pas mute ditekan.
let currentAudio = null;

// Index terakhir yang kepilih tiap pool — dipakai biar file yang SAMA ga
// keputer 2x berturut-turut. Murni Math.random() bisa aja ngasih hasil sama
// beberapa kali beruntun (itu wajar, bukan bug), tapi kedengerannya kayak
// "kok gini-gini aja" — jadi di sini kita sengaja larang pengulangan langsung.
let lastBenarIdx = -1;
let lastSalahIdx = -1;

function pickRandomIndex(poolLength, lastIdx) {
  if (poolLength <= 1) return 0;
  let idx;
  do {
    idx = Math.floor(Math.random() * poolLength);
  } while (idx === lastIdx);
  return idx;
}

// ── P5 sword stab: diagonal, nancep tepat di tombol jawaban, fade out di tempat ──
function playSwordStab(swordEl, targetBtn) {
  // Hentikan animasi yang lagi jalan (kalau ada) SEBELUM mulai yang baru —
  // ini kunci fix "kadang cuma muncul sekali": dulu pakai banyak setTimeout
  // yang numpuk & saling motong; element.animate() + cancel() gak punya
  // masalah itu karena tiap panggilan selalu instance animasi baru & bersih.
  if (swordEl._swordAnim) {
    try { swordEl._swordAnim.cancel(); } catch (e) {}
    swordEl._swordAnim = null;
  }

  // Titik target: tengah tombol yang diklik (fallback tengah layar kalau gak ketemu)
  let targetX = window.innerWidth / 2;
  let targetY = window.innerHeight / 2;
  try {
    if (targetBtn) {
      const rect = targetBtn.getBoundingClientRect();
      targetX = rect.left + rect.width * 0.62;
      targetY = rect.top + rect.height / 2;
    }
  } catch (e) {}

  // Arah tusukan: selalu dari kanan-atas ke bawah-kiri (diagonal), dengan
  // sedikit variasi acak tiap kali biar gak identik-identik amat.
  const jitter = (Math.random() - 0.5) * 18; // -9..+9 deg variasi arah
  const travelDeg = 135 + jitter; // 135deg = arah kanan-atas -> kiri-bawah (sistem sumbu y ke bawah)
  const dist = Math.max(420, window.innerWidth * 0.5);
  const rad = (travelDeg * Math.PI) / 180;
  const startOffsetX = -Math.cos(rad) * dist; // titik AWAL relatif ke target
  const startOffsetY = -Math.sin(rad) * dist;

  // Gambar sword.png: ujung mata pedang menghadap ke BAWAH (90deg di sistem
  // layar). Supaya ujungnya yang mimpin arah gerak (bukan gagangnya),
  // rotasi elemen = arah tempuh - 90deg.
  const rotateDeg = travelDeg - 90;

  // Elemen di-anchor lewat left/top di titik UJUNG mata pedang (bukan pojok
  // kotak gambar), match dengan transform-origin: 52% 99% di CSS + height:130px
  // tetap di markup. Karena rotate/scale muter di titik itu (transform-origin)
  // dan translate() selalu jalan di ruang layar (di luar rotate/scale), ujung
  // pedang bakal selalu pas nancep di targetX/targetY di ujung animasi,
  // berapa pun sudut rotasinya.
  const SWORD_TIP_OFFSET_X = 38.4; // 52% dari lebar render (height:150px, rasio asli 136:276)
  const SWORD_TIP_OFFSET_Y = 148.5; // 99% dari tinggi render (150px)
  swordEl.style.left = (targetX - SWORD_TIP_OFFSET_X) + "px";
  swordEl.style.top = (targetY - SWORD_TIP_OFFSET_Y) + "px";

  const scaleImpact = 1.1;
  const TOTAL_DURATION = 1650; // ms — sebelumnya 900ms, kerasa sekilas doang
  // Revisi timing (fix laporan "fade in & fade out kecepetan"):
  // PENTING — akar masalah sebenarnya bukan cuma di offset keyframe, tapi di
  // easing GLOBAL yang lama: "cubic-bezier(0.16, 0.9, 0.2, 1)" dipasang di
  // level animate() (bukan per-keyframe). Itu artinya SELURUH timeline
  // (bukan cuma transform-nya) ikut dibengkokkan kurva itu — dan kurva itu
  // "ngebut" ke ~90% progress cuma dalam ~16% durasi lalu landai. Akibatnya
  // walau offset 0.34→0.74 didesain buat "diem lama", posisi efektifnya di
  // waktu asli ke-geser jauh ke depan (hampir seketika), jadi yang kelihatan
  // di layar cuma: numongol sekilas → langsung mulai pudar. Fix-nya: easing
  // top-level di-set "linear" (waktu asli = offset apa adanya), dan variasi
  // percepatan/perlambatan gerak sekarang ditaruh PER-KEYFRAME (easing di tiap
  // titik cuma ngaruh ke interpolasi menuju keyframe berikutnya, gak
  // ngebengkokin keseluruhan timeline). Hasilnya offset 0.34–0.74 beneran
  // holdnya di rentang waktu asli ~560ms–1220ms, bukan kepotong duluan.
  const keyframes = [
    { opacity: 0, transform: `translate(${startOffsetX}px, ${startOffsetY}px) rotate(${rotateDeg}deg) scale(0.5)`, offset: 0, easing: "cubic-bezier(0.3, 0, 0.6, 1)" },
    { opacity: 0.55, transform: `translate(${startOffsetX * 0.62}px, ${startOffsetY * 0.62}px) rotate(${rotateDeg}deg) scale(0.7)`, offset: 0.1, easing: "ease-out" },
    { opacity: 1, transform: `translate(${startOffsetX * 0.22}px, ${startOffsetY * 0.22}px) rotate(${rotateDeg}deg) scale(0.85)`, offset: 0.18, easing: "ease-out" },
    { opacity: 1, transform: `translate(0px, 0px) rotate(${rotateDeg}deg) scale(${scaleImpact})`, offset: 0.34, easing: "ease-out" },
    { opacity: 1, transform: `translate(0px, 0px) rotate(${rotateDeg}deg) scale(1)`, offset: 0.42, easing: "linear" },
    { opacity: 1, transform: `translate(0px, 0px) rotate(${rotateDeg}deg) scale(1)`, offset: 0.74, easing: "ease-in" },
    { opacity: 0, transform: `translate(0px, 0px) rotate(${rotateDeg}deg) scale(1)`, offset: 1 }
  ];
  try {
    swordEl._swordAnim = swordEl.animate(keyframes, {
      duration: TOTAL_DURATION,
      easing: "linear", // waktu beneran linear, biar offset di atas gak kebengkok lagi
      fill: "forwards",
    });
    swordEl._swordAnim.onfinish = () => { swordEl._swordAnim = null; };
  } catch (e) { /* browser lama tanpa Web Animations API — diam aja, gak fatal */ }

  // ── Impact flash: nyala sekilas pas ujung pedang nyampe (offset 0.34) ──
  playSwordFlash(targetX, targetY, TOTAL_DURATION * 0.34);
}

// Ledakan cahaya kecil pas titik impact, biar momen "nancep"-nya kerasa
// jelas walau pedangnya sendiri banyak area hitam pekat.
function playSwordFlash(x, y, delayMs) {
  const flashEl = document.getElementById("p5SwordFlash");
  if (!flashEl) return;
  if (flashEl._flashAnim) {
    try { flashEl._flashAnim.cancel(); } catch (e) {}
    flashEl._flashAnim = null;
  }
  flashEl.style.left = x + "px";
  flashEl.style.top = y + "px";
  const flashKeyframes = [
    { opacity: 0, transform: "scale(0.2)", offset: 0 },
    { opacity: 1, transform: "scale(1.3)", offset: 0.25 },
    { opacity: 0.85, transform: "scale(1.1)", offset: 0.4 },
    { opacity: 0, transform: "scale(1.4)", offset: 1 }
  ];
  try {
    flashEl._flashAnim = flashEl.animate(flashKeyframes, {
      duration: 500,
      delay: Math.max(0, delayMs),
      easing: "ease-out",
      fill: "forwards",
    });
    flashEl._flashAnim.onfinish = () => { flashEl._flashAnim = null; };
  } catch (e) { /* noop */ }
}

function playSound(correct) {
  if (!isMuted) {
    const pool = correct ? benarPool : salahPool;
    const lastIdx = correct ? lastBenarIdx : lastSalahIdx;
    const idx = pickRandomIndex(pool.length, lastIdx);
    if (correct) lastBenarIdx = idx; else lastSalahIdx = idx;
    const chosen = pool[idx];
    try {
      chosen.pause(); chosen.currentTime = 0;
      currentAudio = chosen;
      chosen.play().catch(() => {});
    } catch { /* noop */ }
  }
  // ── P5 Mode: sword slash + notification banner ──
  if (theme === "p5") {
    const swordEl = document.getElementById("p5Sword");
    const notifEl = document.getElementById("p5Notif");
    // Sword — nusuk diagonal tepat ke jawaban yang baru diklik.
    // Prioritaskan referensi elemen asli (window.p5LastOptionEl) — cuma
    // fallback ke query by-letter kalau elemen itu udah gak ada di DOM lagi
    // (misal kena rebuild render() duluan sebelum sempet dipakai).
    if (swordEl) {
      const targetBtn = (window.p5LastOptionEl && document.body.contains(window.p5LastOptionEl))
        ? window.p5LastOptionEl
        : document.querySelector('.option[data-letter="' + (window.p5LastLetter || "") + '"]');
      playSwordStab(swordEl, targetBtn);
    }
    // Notification banner — gambar CLEAR/FAILED-nya sendiri udah lengkap
    // (nama & teks baked-in), jadi di sini cuma ganti class buat milih
    // gambar mana yang tampil + munculin, tanpa overlay teks apapun.
    if (notifEl) {
      notifEl.className = "p5Notif" + (correct ? " p5NotifCorrect" : " p5NotifWrong");
      notifEl.classList.add("show");
      if (notifEl._hideTimer) clearTimeout(notifEl._hideTimer);
      notifEl._hideTimer = setTimeout(() => notifEl.classList.remove("show"), 2200);
    }
  }
}
function toggleMute() {
  isMuted = !isMuted;
  localStorage.setItem(MUTE_KEY, String(isMuted));
  if (isMuted) {
    // Berhenti LANGSUNG, bukan nunggu suara yang lagi jalan selesai duluan.
    try { currentAudio?.pause(); if (currentAudio) currentAudio.currentTime = 0; } catch { /* noop */ }
  }
  render();
}
function setVolume(v) {
  volume = Math.min(1, Math.max(0, v));
  [...benarPool, ...salahPool].forEach((a) => { a.volume = volume; });
  try { localStorage.setItem(VOLUME_KEY, String(volume)); } catch { /* noop */ }
}

// ── P5 Mode: Ransom/cutout letter effect ──────────────────────────────────
// Called after render() in P5 mode. Wraps heading/label text in per-char
// spans. Chars at positions determined by a lightweight hash get the
// red-box invert treatment — looks like cut-out ransom note letters.
// NEVER applied to question text, option text, or image containers.
function p5RansomifyEl(el) {
  if (!el || el.dataset.p5r === "1") return; // already done
  const text = el.textContent;
  if (!text.trim()) return;
  // Deterministic "random" selection: pick ~1 in 3 chars using char code sum
  let out = "";
  let charIdx = 0;
  for (const ch of text) {
    if (ch === " " || ch === "\n") {
      out += '<span class="p5rc p5rc-space"> </span>';
    } else {
      // Use char code + position hash to decide invert — not every Nth, more organic
      const hash = (ch.charCodeAt(0) * 13 + charIdx * 7) % 11;
      const isInv = hash < 3; // ~27% of chars get inverted
      out += isInv
        ? `<span class="p5rc p5rc-inv" aria-hidden="true">${ch}</span>`
        : `<span class="p5rc">${ch}</span>`;
      charIdx++;
    }
  }
  el.innerHTML = out;
  el.dataset.p5r = "1";
}

function p5ApplyRansom() {
  if (theme !== "p5") return;
  // Only target decorative headings — NOT question text or answer options
  const selectors = [
    ".sectionLabel",
    ".catName",
    ".pickerHeader h1",
    ".doneBanner .title",
    ".scoreHero .gradeLabel",
    ".reviewLabel",
    ".pkgSubtitle",
  ];
  selectors.forEach(sel => {
    document.querySelectorAll(sel).forEach(el => {
      el.classList.add("p5-ransom");
      p5RansomifyEl(el);
    });
  });
}

function currentLsKey() {

}
function loadBiasa() {
  try {
    const raw = localStorage.getItem(currentLsKey());
    if (!raw) return null;
    const parsed = JSON.parse(raw);

    return null;
  } catch { return null; }
}
function saveBiasa() {
  try {
    localStorage.setItem(currentLsKey(), JSON.stringify({

      answersMap: biasaAnswersMap,

}

let biasaVisibleCount = LOAD_BATCH;
let shuffleOrderCache = {}; // cache urutan acak, biar stabil selama sesi

// ── Init Mode Latihan dari localStorage ──────────────────────────────────
function initBiasa() {
  const saved = loadBiasa();
  // Selalu reset dulu ke default sebelum load — supaya kalau paket baru
  // belum pernah punya progres tersimpan, state paket sebelumnya (yang
  // masih ada di memory) tidak ikut kebawa / "bocor" ke paket baru.
  biasaShuffleOn = false;
  biasaAnswersMap = {};
  if (saved) {
    biasaShuffleOn = !!saved.shuffleOn;
    biasaAnswersMap = saved.answersMap || {};
  }
  biasaVisibleCount = LOAD_BATCH;
  biasaLoaded = true;
}

// ── Mode Latihan: hitung daftar soal aktif (shuffle) ─────────────────────
function computeBiasaAll() {
  const key = "__shuffle";
  if (!biasaShuffleOn) {
    delete shuffleOrderCache[key];
    return allQuestions;
  }
  const cached = shuffleOrderCache[key];
  const baseIds = new Set(allQuestions.map(q => q.id));
  if (cached && cached.length === allQuestions.length && cached.every(q => baseIds.has(q.id))) return cached;
  const shuffled = shuffleArray(allQuestions);
  shuffleOrderCache[key] = shuffled;
  return shuffled;
}

// ── Mode Latihan: handlers ───────────────────────────────────────────────
function handleResetBiasa() {
  clearBiasa();
  biasaAnswersMap = {};
  biasaVisibleCount = LOAD_BATCH;
  shuffleOrderCache = {};
  render();
}
function handleBiasaShuffleToggle() {
  biasaShuffleOn = !biasaShuffleOn;
  biasaVisibleCount = LOAD_BATCH;
  saveBiasa();
  render();
}
function handleBiasaLoadMore() {
  const allQ = computeBiasaAll();
  biasaVisibleCount = Math.min(biasaVisibleCount + LOAD_BATCH, allQ.length);
  render();
}
function handleAnswerBiasa(qId, letter) {
  if (biasaAnswersMap[qId] !== undefined && biasaAnswersMap[qId] !== null) return;
  const q = allQuestions.find(x => x.id === qId);
  biasaAnswersMap[qId] = letter;
  saveBiasa();
  playSound(!!q && letter === q.answer);
  render();
}

// ── Mode Tentamen: handlers ──────────────────────────────────────────────
function stopTentamenTimerLoop() {
  if (tentamenTimerHandle) { clearInterval(tentamenTimerHandle); tentamenTimerHandle = null; }
  if (tentamenAdvanceHandle) { clearTimeout(tentamenAdvanceHandle); tentamenAdvanceHandle = null; }
}
function startTentamenTimerLoop() {
  stopTentamenTimerLoop();
  tentamenTimerHandle = setInterval(() => {
    if (quizMode !== "tentamen" || tentamenState !== "running" || qPhase !== "answering") return;
    if (tentamenDifficulty === "bekicot") return; // no timer
    if (timeLeft <= 1) {
      timeLeft = 0;
      tentamenAnswers[currentIdx] = "skipped";
      qPhase = "answered_timeout";
      render();
      tentamenAdvanceHandle = setTimeout(advanceOrFinish, 1800);
    } else {
      timeLeft -= 1;
      updateTimerDOM();
    }
  }, 1000);
}

// ── Update tampilan timer secara langsung (tanpa render ulang seluruh halaman) ──
// Ini mencegah "blink" karena kartu soal & animasi ikut dibuat ulang tiap detik.
function updateTimerDOM() {
  const cfg = DIFFICULTY_CONFIG[tentamenDifficulty];
  const maxTime = cfg.timerSeconds || 1;
  const isUrgent = timeLeft <= 10 && tentamenDifficulty !== "bekicot";
  const timerPct = (timeLeft / maxTime) * 100;
  const timerNumEl = document.getElementById("timerNum");
  const timerFillEl = document.getElementById("timerFill");
  const timerCardEl = document.getElementById("timerCard");
  const timerLabelEl = document.getElementById("timerLabel");
  if (!timerNumEl || !timerFillEl || !timerCardEl) return;

  timerNumEl.textContent = String(timeLeft).padStart(2, "0");
  timerNumEl.style.color = isUrgent ? "var(--wrong-strong)" : cfg.color;
  timerNumEl.classList.toggle("pulse", isUrgent);

  timerFillEl.style.width = timerPct + "%";
  timerFillEl.style.background = isUrgent ? "var(--wrong-strong)" : cfg.color;

  timerCardEl.classList.toggle("urgent", isUrgent);
  if (timerLabelEl) timerLabelEl.classList.toggle("urgent", isUrgent);
}
function handleStartTentamen() {
  // Soal rusak (isBroken) tidak dimasukkan ke Mode Tentamen karena tidak punya opsi/jawaban.
  const quizzable = allQuestions.filter(q => !q.isBroken);
  const qs = tentamenShuffleOn ? shuffleArray(quizzable) : quizzable;
  if (!qs.length) return;
  tentamenQuestions = qs;
  tentamenAnswers = new Array(qs.length).fill(null);
  currentIdx = 0;
  timeLeft = DIFFICULTY_CONFIG[tentamenDifficulty].timerSeconds;
  qPhase = "answering";
  tentamenState = "running";
  render();
  startTentamenTimerLoop();
}
function handleResetTentamen() {
  tentamenState = "setup";
  tentamenQuestions = [];
  tentamenAnswers = [];
  stopTentamenTimerLoop();
  render();
}
function handleAnswerTentamen(letter) {
  if (tentamenAnswers[currentIdx] !== null && tentamenAnswers[currentIdx] !== undefined) return;
  const q = tentamenQuestions[currentIdx];
  tentamenAnswers[currentIdx] = letter;
  playSound(letter === q.answer);
  qPhase = "answered_manual";
  render();
}
function advanceOrFinish() {
  if (tentamenAdvanceHandle) { clearTimeout(tentamenAdvanceHandle); tentamenAdvanceHandle = null; }
  if (currentIdx >= tentamenQuestions.length - 1) {
    tentamenState = "finished";
    stopTentamenTimerLoop();
  } else {
    currentIdx += 1;
    timeLeft = DIFFICULTY_CONFIG[tentamenDifficulty].timerSeconds;
    qPhase = "answering";
  }
  render();
}

// ── Mode switch ───────────────────────────────────────────────────────────
function handleModeChange(m) {
  if (m === quizMode) return;
  quizMode = m;
  if (m === "tentamen") {
    tentamenState = "setup";
    tentamenQuestions = [];
    tentamenAnswers = [];
  }
  stopTentamenTimerLoop();
  render();
}

// ── Klik opsi jawaban (delegasi, dipakai Latihan & Tentamen) ─────────────
function onOptionClick(qid, letter, btnEl) {
  // Simpen elemen tombol yang BENERAN diklik, bukan cuma huruf-nya. Di Mode
  // Latihan banyak soal tampil sekaligus di satu halaman — kalau targeting
  // sword cuma nyari ".option[data-letter=...]" lewat huruf doang, itu bakal
  // ketemu tombol pertama yang cocok di SELURUH halaman (bisa punya soal
  // lain / yang udah kescroll lewat), jadi sword-nya kayak nusuk ke tempat
  // yang gak keliatan / gak nongol sama sekali di Mode Latihan.
  if (theme === "p5") { window.p5LastOptionEl = btnEl || null; window.p5LastLetter = letter; }
  if (quizMode === "biasa") {
    handleAnswerBiasa(qid, letter);
  } else if (quizMode === "tentamen" && tentamenState === "running" && qPhase === "answering") {
    handleAnswerTentamen(letter);
  }
}

// ── beforeunload — hanya warning saat tentamen sedang berjalan ───────────
window.addEventListener("beforeunload", (e) => {
  if (quizMode === "tentamen" && tentamenState === "running") {
    e.preventDefault();
    e.returnValue = "";
  }
});

const brokenRevealed = new Set(); // Set of q.id that have been tapped open

  const isRevealed = brokenRevealed.has(q.id);

  const hasQImages = (q.questionImages || []).length > 0;

  const revealHtml = isRevealed ? `

      ${hasQImages ? (q.questionImages || []).map(src => `<img class="exImg" src="${src}" alt="gambar soal">`).join("") : ""}
      ${hasImages
        ? (q.explanationImages || []).map(src => `<img class="exImg" src="${src}" alt="gambar penjelasan">`).join("")
        : `<p class="noImg">(belum ada gambar penjelasan di dokumen ini)</p>`}

  return `
    <div class="brokenCard" data-broken-id="${escapeAttr(q.id)}">
      <div class="brokenMeta">
        <span class="brokenBadge">⚠️ Soal Rusak</span>

      </div>
      <p class="brokenQ"><span class="brokenNum">${qNum}.</span>${escapeHtml(q.question)}</p>

}

// ── Render: header + mode bar + filter bar ────────────────────────────────

    const answeredCount = quizzableAll.filter(q => biasaAnswersMap[q.id] !== undefined && biasaAnswersMap[q.id] !== null).length;
    const correctCount = quizzableAll.filter(q => biasaAnswersMap[q.id] === q.answer).length;
    trackerHtml = `
      <div class="tracker">

    trackerHtml = `
