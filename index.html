// ── Render: Mode Latihan ──────────────────────────────────────────────────
function renderBiasaMode() {
  const allQ = computeBiasaAll();
  const visible = allQ.slice(0, biasaVisibleCount);
  // Soal rusak tidak dihitung di progress tracker (tidak bisa dijawab)
  const quizzableQ = allQ.filter(q => !q.isBroken);
  const answeredCount = quizzableQ.filter(q => biasaAnswersMap[q.id] !== undefined && biasaAnswersMap[q.id] !== null).length;
  const correctCount = quizzableQ.filter(q => biasaAnswersMap[q.id] === q.answer).length;
  const totalCount = quizzableQ.length; // hanya soal yang bisa dijawab
  const pct = totalCount > 0 ? Math.round((answeredCount / totalCount) * 100) : 0;
  const allDone = answeredCount === totalCount && totalCount > 0;
  const hasMore = biasaVisibleCount < allQ.length; // load more berdasarkan total semua soal
  const remaining = allQ.length - visible.length;

  let html = `
    <div class="progressCard">
      <div class="progressTop">
        <span class="left">Sudah dijawab: <span class="num mono">${answeredCount}</span> / Total: <span class="num total mono">${totalCount}</span></span>
        <div style="display:flex; gap:12px;">
          <span class="statChip"><span class="dot" style="background:var(--correct);"></span><span class="mono" style="color:var(--correct); font-weight:700;">${correctCount}</span><span style="color:var(--muted2);">benar</span></span>
          <span class="statChip"><span class="dot" style="background:var(--wrong);"></span><span class="mono" style="color:var(--wrong); font-weight:700;">${answeredCount - correctCount}</span><span style="color:var(--muted2);">salah</span></span>
        </div>
      </div>
      <div class="progressTrack"><div class="progressFill" style="width:${pct}%;"></div></div>
    </div>
  `;

  if (allDone) {
    html += `
      <div class="doneBanner">
        <span style="font-size:1.3rem;">\uD83C\uDFC6</span>
        <div>
          <span class="title">Selesai! </span>
          <span class="sub">Skor akhir: ${correctCount}/${totalCount} (${Math.round((correctCount/totalCount)*100)}%)</span>
        </div>
      </div>
    `;
  }

  if (allQ.length === 0) {
    html += `<div class="empty">Tidak ada soal pada kategori ini.</div>`;
    return html;
  }

  html += `<div class="qList">`;
  visible.forEach((q, idx) => {
    if (q.isBroken) {
      html += renderBrokenCard(q, idx + 1);
    } else {
      html += renderQuestionCard(q, idx + 1, biasaAnswersMap[q.id], true);
    }
  });
  html += `</div>`;

  if (hasMore) {
    html += `<button class="loadMoreBtn" id="loadMoreBtn">\u2794 Lebih banyak (${Math.min(LOAD_BATCH, remaining)})</button>`;
  }

  return html;
}

// ── Render: Tentamen — setup ──────────────────────────────────────────────
function renderTentamenSetup() {
  const qCount = allQuestions.filter(q => !q.isBroken).length; // soal rusak tidak masuk tentamen
  const cfg = DIFFICULTY_CONFIG[tentamenDifficulty];
  const timerSec = cfg.timerSeconds;
  const estLabel = (() => {
    if (timerSec === 0) return "\u221E";
    const totalSec = qCount * timerSec;
    if (totalSec < 60) return `${totalSec} dtk`;
    return `${Math.ceil(totalSec / 60)} menit`;
  })();
  const timerLabel = timerSec === 0 ? "\u221E" : `${timerSec}s`;

  let html = `<div class="quiz-fade-in">`;
  html += `<div style="margin-bottom:16px;">
    <div class="sectionLabel">Tingkat Kesulitan</div>
    <div class="diffGrid">`;
  Object.keys(DIFFICULTY_CONFIG).forEach(d => {
    const dcfg = DIFFICULTY_CONFIG[d];
    const active = tentamenDifficulty === d;
    html += `
      <button class="diffCard${active ? " active" : ""}" data-diff="${d}" style="${active ? `border-color:${dcfg.color}; background:${dcfg.color}18;` : ""}">
        <div class="diffTop">
          <span class="diffEmoji">${dcfg.emoji}</span>
          <span class="diffLabel" style="color:${active ? dcfg.color : "var(--text)"};">${dcfg.label}</span>
        </div>
        <div class="diffDesc">${escapeHtml(dcfg.desc)}</div>
        <div class="diffTimer" style="color:${active ? dcfg.color : "var(--muted3)"};">${dcfg.timerSeconds === 0 ? "5-7 hari kerja" : `${dcfg.timerSeconds}s / soal`}</div>
      </button>
    `;
  });
  html += `</div></div>`;

  html += `<div class="statsRow3">
    <div class="statBox2"><div class="val">${qCount}</div><div class="lbl">Soal</div></div>
    <div class="statBox2"><div class="val">${timerLabel}</div><div class="lbl">Timer/soal</div></div>
    <div class="statBox2"><div class="val">${estLabel}</div><div class="lbl">Estimasi</div></div>
  </div>`;

  html += `<button class="startTentamenBtn" id="startTentamenBtn" style="background:${cfg.color};" ${qCount === 0 ? "disabled" : ""}>
    \u25B6 Mulai Tentamen \u2014 ${cfg.emoji} ${cfg.label}
  </button>`;
  html += `</div>`;
  return html;
}

// ── Render: Tentamen — running ────────────────────────────────────────────
function renderTentamenRunning() {
  const q = tentamenQuestions[currentIdx];
  if (!q) return `<div class="empty">Tidak ada soal.</div>`;
  const cfg = DIFFICULTY_CONFIG[tentamenDifficulty];
  const maxTime = cfg.timerSeconds || 1;
  const isAnswering = qPhase === "answering";
  const isManual = qPhase === "answered_manual";
  const isTimeout = qPhase === "answered_timeout";
  const isUrgent = timeLeft <= 10 && isAnswering && tentamenDifficulty !== "bekicot";
  const timerPct = tentamenDifficulty === "bekicot" ? 100 : (timeLeft / maxTime) * 100;
  const total = tentamenQuestions.length;
  const qNum = currentIdx + 1;

  // Fade-in cuma pas soal ini pertama kali tampil (baru pindah/mulai) —
  // BUKAN tiap render() ulang gara-gara jawaban diklik (lihat komentar di
  // deklarasi tentamenFadeKey).
  const freshKey = tentamenState + "|" + currentIdx;
  const isFreshQuestion = freshKey !== tentamenFadeKey;
  tentamenFadeKey = freshKey;
  let html = `<div class="${isFreshQuestion ? "quiz-fade-in" : ""}">`;

  html += `<div class="tentamenTop">
    <span class="qOf">Soal <span class="mono" style="color:var(--accent); font-weight:700;">${qNum}</span> dari ${total}</span>
    <div class="dotsRow">`;
  const dotCount = Math.min(total, 15);
  for (let i = 0; i < dotCount; i++) {
    const done = i < qNum - 1;
    const current = i === qNum - 1;
    html += `<div class="dotItem${done ? " done" : ""}${current ? " current" : ""}"></div>`;
  }
  if (total > 15) html += `<span class="dotsOverflow">+${total - 15}</span>`;
  html += `</div></div>`;

  html += `<div class="timerCard${isUrgent ? " urgent" : ""}${isTimeout ? " timeoutFlash" : ""}" id="timerCard">
    <div class="timerTop">
      <div class="timerLabel${isUrgent ? " urgent" : ""}" id="timerLabel">
        \u23F1 ${tentamenDifficulty === "bekicot" ? "No timer \uD83D\uDC0C" : isAnswering ? "Waktu tersisa" : isTimeout ? "Waktu habis!" : "Selesai"}
      </div>
      <span class="timerNum${isUrgent ? " pulse" : ""}" id="timerNum" style="color:${isUrgent ? "var(--wrong-strong)" : cfg.color};">
        ${tentamenDifficulty === "bekicot" ? "\u221E" : String(isAnswering ? timeLeft : isTimeout ? 0 : timeLeft).padStart(2, "0")}
      </span>
    </div>
    <div class="timerTrack"><div class="timerFill" id="timerFill" style="background:${isUrgent ? "var(--wrong-strong)" : cfg.color}; width:${tentamenDifficulty === "bekicot" ? 100 : isAnswering ? timerPct : isTimeout ? 0 : 100}%;"></div></div>
  </div>`;

  html += renderQuestionCard(q, qNum, tentamenAnswers[currentIdx], qPhase !== "answering");

  if (isTimeout) {
    html += `<div class="timeoutNotice">\u26A0\uFE0F <span>Waktu habis! Soal ini dihitung terlewati. Melanjutkan\u2026</span></div>`;
  }

  if (isManual) {
    html += `<button class="nextBtn" id="nextTentamenBtn">${qNum < total ? "\u2794 Soal Berikutnya" : "\uD83C\uDFC6 Lihat Hasil"}</button>`;
  }

  html += `</div>`;
  return html;
}

// ── Render: Tentamen — hasil ──────────────────────────────────────────────
function renderTentamenResults() {
  const total = tentamenQuestions.length;
  const correct = tentamenAnswers.filter((a, i) => typeof a === "string" && a !== "skipped" && a === tentamenQuestions[i]?.answer).length;
  const skipped = tentamenAnswers.filter(a => a === "skipped").length;
  const wrong = total - correct - skipped;
  const pct = total > 0 ? Math.round((correct / total) * 100) : 0;
  const gradeColor = pct >= 80 ? "var(--correct)" : pct >= 60 ? "var(--accent)" : "var(--wrong)";
  const gradeLabel = pct >= 80 ? "Sangat Baik" : pct >= 60 ? "Cukup Baik" : "Perlu Belajar Lagi";

  let html = `<div class="quiz-fade-in">`;

  html += `
    <div class="scoreHero">
      <div class="trophy">\uD83C\uDFC6</div>
      <div class="pct" style="color:${gradeColor};">${pct}%</div>
      <div class="gradeLabel" style="color:${gradeColor};">${gradeLabel}</div>
      <div class="subline">${correct} dari ${total} soal benar</div>
    </div>
  `;

  html += `
    <div class="statsGrid statsGrid3">
      <div class="statBox" style="background:#16a34a20; border-color:#16a34a40; color:var(--correct);"><div class="val mono">${correct}</div><div class="lbl">Benar</div></div>

        ${wrong > 0 ? `<div style="flex:${wrong}; background:var(--wrong);"></div>` : ""}

  html += `</div>`;

}

// ── Render: layar pilih kategori / paket soal ─────────────────────────────
function formatDateShort(iso) {
  try {
    return new Date(iso).toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "numeric" });
  } catch { return ""; }
}

// ── Render: kartu Pengaturan (tema + volume) — tampil di bawah daftar kategori ──
const THEME_OPTIONS = [
  { value: "light", icon: "\u2600\uFE0F", label: "Terang" },
  { value: "dark", icon: "\uD83C\uDF19", label: "Gelap" },
  { value: "p5", icon: '<img src="./favicon.ico" style="width:16px;height:16px;vertical-align:middle;image-rendering:pixelated;">', label: "Persona 5" },
];
function renderSettingsCard() {
  const volPct = Math.round(volume * 100);
  const current = THEME_OPTIONS.find((o) => o.value === theme) || THEME_OPTIONS[1];
  return `
    <div class="settingsCard">
      <div class="sectionLabel">\u2699\uFE0F Pengaturan</div>

      <div class="settingsRow">
        <div class="settingsRowText">
          <span class="settingsRowTitle themeModeTitle">${current.icon} Mode UI: ${current.label}</span>
          <span class="settingsRowDesc">Pilih tampilan!</span>

        </button>
      </div>
      ${themeMenuOpen ? `
      <div class="themeModeOptions">
        ${THEME_OPTIONS.map((o) => `
          <button class="themeModeOption${o.value === theme ? " active" : ""}" data-theme-value="${o.value}">

function renderPickerScreen() {
  const grouped = {};
  packageManifest.forEach((p) => {
    if (!grouped[p.category]) grouped[p.category] = [];
    grouped[p.category].push(p);
  });
  const categories = Object.keys(grouped).sort((a, b) => a.localeCompare(b));

  let html = `
    <main class="wrap">
      <div class="pickerHeader">
        <h1>Pilih Paket Soal</h1>
        <p class="pickerSub">Ketuk kategori untuk membuka daftar paket soal di dalamnya.</p>
      </div>
      <div class="categoryList">
  `;

  categories.forEach((cat) => {
    const isOpen = expandedCategories.has(cat);
    const pkgs = grouped[cat];
    html += `
      <div class="categoryGroup">
        <button class="categoryHeader${isOpen ? " open" : ""}" data-cat="${escapeAttr(cat)}">
          <span class="catName">${escapeHtml(cat)}</span>
          <span class="catMeta">${pkgs.length} paket</span>
          <span class="catArrow">${isOpen ? "\u25B2" : "\u25BC"}</span>
        </button>
        <div class="categoryBody${isOpen ? " open" : ""}">
          ${pkgs.map((p) => `
            <button class="packageItem${activePackage && activePackage.id === p.id ? " active" : ""}" data-pkg="${escapeAttr(p.id)}">
              <span class="pkgTitle">${escapeHtml(p.title)}</span>
              <span class="pkgMeta">${p.count} soal${p.convertedAt ? " \u00B7 " + formatDateShort(p.convertedAt) : ""}</span>
            </button>
          `).join("")}
        </div>
      </div>
    `;
  });

  html += `</div>`;
  html += renderSettingsCard();
  if (activePackage) {
    html += `<button class="pickerCloseBtn" id="pickerCloseBtn">\u2190 Kembali ke paket saat ini</button>`;
  }
  html += `</main>`;
  return html;
}

function attachPickerHandlers() {
  app.querySelectorAll(".categoryHeader[data-cat]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const cat = btn.dataset.cat;
      if (expandedCategories.has(cat)) expandedCategories.delete(cat);
      else expandedCategories.add(cat);
      render();
    });
  });
  app.querySelectorAll(".packageItem[data-pkg]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const pkg = packageManifest.find((p) => p.id === btn.dataset.pkg);
      if (!pkg) return;
      const proceed = async () => {
        await selectPackage(pkg);
        pickerOpen = false;
        render();
      };
      if (theme === "p5") {
        btn.classList.add("p5WiggleSelect");
        setTimeout(proceed, 480); // biarin animasi wiggle kelar dulu sebelum pindah layar
      } else {
        await proceed();
      }
    });
  });
  const closeBtn = document.getElementById("pickerCloseBtn");
  if (closeBtn) closeBtn.addEventListener("click", () => { pickerOpen = false; render(); });

  const themeModeToggleBtn = document.getElementById("themeModeToggleBtn");
  if (themeModeToggleBtn) themeModeToggleBtn.addEventListener("click", () => {
    themeMenuOpen = !themeMenuOpen;
    render();
  });
  document.querySelectorAll(".themeModeOption").forEach((btn) => {
    btn.addEventListener("click", () => {
      setTheme(btn.getAttribute("data-theme-value"));
      themeMenuOpen = false;
      render();
    });
  });

  const volumeSlider = document.getElementById("volumeSlider");
  if (volumeSlider) volumeSlider.addEventListener("input", () => {
    const v = parseInt(volumeSlider.value, 10) / 100;
    setVolume(Number.isNaN(v) ? 1 : v);
    // Update label langsung tanpa render ulang, biar slider gak "lompat" pas ditarik.
    const valEl = document.getElementById("volumeVal");
    if (valEl) valEl.textContent = `${Math.round(volume * 100)}%`;
  });
}

// ── Render utama ───────────────────────────────────────────────────────────
function render() {
  syncThemeClass();

  if (pickerOpen && packageManifest.length > 0) {
    app.innerHTML = renderPickerScreen();
    attachPickerHandlers();
    if (theme === "p5") requestAnimationFrame(p5ApplyRansom);
    return;
  }

  if (!allQuestions || allQuestions.length === 0) {
    if (packageManifest.length > 0) {
      // Ada paket terdaftar tapi belum ada yang dipilih — langsung tampilkan pemilih.
      app.innerHTML = renderPickerScreen();
      attachPickerHandlers();
      return;
    }
    app.innerHTML = `<div class="empty">Belum ada soal. Tambahkan manual di data/questions.js, atau jalankan: npm run convert -- file.docx [kategori] [judul-paket]</div>`;
    return;
  }

  let html = renderHeaderZone();
  html += `<main class="wrap">`;

  if (quizMode === "biasa") {
    html += biasaLoaded ? renderBiasaMode() : `<div class="empty">Memuat soal\u2026</div>`;
  } else {
    if (tentamenState === "setup") html += renderTentamenSetup();
    else if (tentamenState === "running") html += renderTentamenRunning();
    else html += renderTentamenResults();
  }

  html += `</main>`;
  // Simpen posisi scroll sebelum innerHTML diganti — app.innerHTML = html
  // ngganti seluruh subtree, dan browser bisa "lompat" balik ke atas
  // sesaat. Ini salah satu sumber "blink" paling kerasa di Mode Latihan
  // (daftar soal panjang, tiba-tiba serasa nge-jump tiap jawab).
  const prevScrollY = window.scrollY;
  app.innerHTML = html;
  window.scrollTo(0, prevScrollY);
  attachHandlers();
  if (theme === "p5") requestAnimationFrame(p5ApplyRansom);
}

// ── Pasang semua event listener setelah tiap render ───────────────────────
function attachHandlers() {
  // Soal rusak — tap untuk toggle reveal
  app.querySelectorAll(".brokenCard[data-broken-id]").forEach(card => {
    card.addEventListener("click", () => {
      const id = card.dataset.brokenId;
      if (brokenRevealed.has(id)) {
        brokenRevealed.delete(id);
      } else {
        brokenRevealed.add(id);
      }
      render();
    });
  });

  app.querySelectorAll(".option[data-letter]").forEach(btn => {
    btn.addEventListener("click", () => onOptionClick(btn.dataset.qid, btn.dataset.letter, btn));
  });

  const hideBtn = document.getElementById("hideHeaderBtn");
  if (hideBtn) hideBtn.addEventListener("click", () => { headerHidden = !headerHidden; render(); });

  const muteBtn = document.getElementById("muteBtn");
  if (muteBtn) muteBtn.addEventListener("click", toggleMute);

  app.querySelectorAll(".pillBtn[data-mode]").forEach(btn => {
    btn.addEventListener("click", () => handleModeChange(btn.dataset.mode));
  });

  const resetBtn = document.getElementById("resetBtn");
  if (resetBtn) resetBtn.addEventListener("click", () => {
    if (quizMode === "biasa") handleResetBiasa();
    else handleResetTentamen();
  });

  const shuffleBtnEl = document.getElementById("shuffleBtn");
  if (shuffleBtnEl) shuffleBtnEl.addEventListener("click", () => {
    if (quizMode === "biasa") handleBiasaShuffleToggle();
    else { tentamenShuffleOn = !tentamenShuffleOn; render(); }
  });

  const loadMoreBtn = document.getElementById("loadMoreBtn");
  if (loadMoreBtn) loadMoreBtn.addEventListener("click", handleBiasaLoadMore);

  app.querySelectorAll(".diffCard[data-diff]").forEach(btn => {
    btn.addEventListener("click", () => { tentamenDifficulty = btn.dataset.diff; render(); });
  });

  const startBtn = document.getElementById("startTentamenBtn");
  if (startBtn) startBtn.addEventListener("click", handleStartTentamen);

  const nextBtn = document.getElementById("nextTentamenBtn");
  if (nextBtn) nextBtn.addEventListener("click", advanceOrFinish);

  const restartTentamenBtn = document.getElementById("restartTentamenBtn");
  if (restartTentamenBtn) restartTentamenBtn.addEventListener("click", handleResetTentamen);

  const pkgSwitchBtn = document.getElementById("pkgSwitchBtn");
  if (pkgSwitchBtn) pkgSwitchBtn.addEventListener("click", () => { pickerOpen = true; render(); });
}

// ── Boot ───────────────────────────────────────────────────────────────────
async function boot() {
  await loadManifest();

  if (packageManifest.length > 0) {
    let savedId;
    try { savedId = localStorage.getItem(ACTIVE_PKG_KEY); } catch { savedId = null; }
    const saved = packageManifest.find((p) => p.id === savedId);
    if (saved) {
      await selectPackage(saved);
    } else {
      pickerOpen = true; // belum pernah pilih paket — langsung tampilkan pemilih
    }
  } else {
    // Tidak ada paket terdaftar sama sekali — pakai mode lama (data/questions.js).
    await loadLegacyQuestions();
    initBiasa();
  }

  render();
}
boot();

const GATE_KEY   = "soalinprem_unlocked";

function gateSubmit() {
  const val = document.getElementById("gate-input").value;
  const inp = document.getElementById("gate-input");
  const err = document.getElementById("gate-err");
  if (val === GATE_PASS) {
    try { localStorage.setItem(GATE_KEY, "1"); } catch { /* noop */ }

    inp.classList.remove("error");
    err.textContent = "";
  } else {
    inp.classList.add("error");
    err.textContent = "Password salah. Coba lagi.";
    setTimeout(() => inp.classList.remove("error"), 400);
  }
}

function gateInit() {
  let unlocked = false;
  try { unlocked = localStorage.getItem(GATE_KEY) === "1"; } catch { /* noop */ }
  if (unlocked) {
    document.getElementById("gate-overlay").classList.add("hidden");
  } else {
    // Enter key support
    document.getElementById("gate-input").addEventListener("keydown", e => {
      if (e.key === "Enter") gateSubmit();
    });
    // Focus the input
    setTimeout(() => document.getElementById("gate-input").focus(), 100);
  }
}

gateInit();

<button id="kp-fab" title="Kelola paket">⚙️</button>
<div id="kp-overlay">
  <div class="kp-card" id="kp-card"><!-- filled by JS --></div>
</div>

<script>
(() => {
  const PIN_HASH_KEY = 'soalin_kp_pin_hash';
  const GH_KEY = 'soalin_kp_gh'; // { owner, repo, branch, token }
  const overlay = document.getElementById('kp-overlay');
  const card = document.getElementById('kp-card');
  let unlockedThisSession = false;
  let workingPackages = null; // edited copy, built on load

  document.getElementById('kp-fab').addEventListener('click', () => {
    overlay.classList.add('open');
    if (unlockedThisSession) renderManager();
    else renderPinScreen();
  });
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.classList.remove('open'); });

  async function sha256Hex(text) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
  }

  function getGhSettings() {
    try { return JSON.parse(localStorage.getItem(GH_KEY) || 'null') || {}; } catch { return {}; }
  }
  function setGhSettings(obj) { localStorage.setItem(GH_KEY, JSON.stringify(obj)); }

  function renderPinScreen() {
    const hasPin = !!localStorage.getItem(PIN_HASH_KEY);
    card.innerHTML = `
      <h2>${hasPin ? 'Masuk Kelola Paket' : 'Buat PIN Kelola Paket'}</h2>
      <div class="kp-sub">${hasPin
        ? 'Panel ini terpisah dari password aplikasi — hanya kamu yang tahu PIN ini.'
        : 'PIN ini cuma dicek di browser ini (bukan keamanan sungguhan — siapapun yang buka source bisa lihat kodenya), tapi cukup buat mencegah orang lain iseng klik-klik.'}</div>
      <label for="kp-pin1">PIN</label>
      <input type="password" inputmode="numeric" id="kp-pin1" placeholder="mis. 4-6 digit">
      ${hasPin ? '' : `<label for="kp-pin2">Ulangi PIN</label><input type="password" inputmode="numeric" id="kp-pin2">`}
      <div class="kp-err" id="kp-pin-err"></div>
      <div class="kp-actions">
        <button id="kp-pin-go">${hasPin ? 'Masuk' : 'Simpan PIN & masuk'}</button>
        <button class="kp-secondary" id="kp-pin-cancel">Batal</button>
      </div>
    `;
    document.getElementById('kp-pin-cancel').onclick = () => overlay.classList.remove('open');
    document.getElementById('kp-pin-go').onclick = async () => {
      const p1 = document.getElementById('kp-pin1').value;
      const err = document.getElementById('kp-pin-err');
      if (!p1) { err.textContent = 'PIN tidak boleh kosong.'; return; }
      if (hasPin) {
        const hash = await sha256Hex(p1);
        if (hash !== localStorage.getItem(PIN_HASH_KEY)) { err.textContent = 'PIN salah.'; return; }
      } else {
        const p2 = document.getElementById('kp-pin2').value;
        if (p1 !== p2) { err.textContent = 'PIN tidak sama.'; return; }
        localStorage.setItem(PIN_HASH_KEY, await sha256Hex(p1));
      }
      unlockedThisSession = true;
      renderManager();
    };
  }

  async function loadPackagesForEdit() {
    try {
      const mod = await import(`./data/manifest.js?t=${Date.now()}`);
      const pkgs = Array.isArray(mod.packages) ? mod.packages : [];
      return JSON.parse(JSON.stringify(pkgs)); // deep copy, safe to mutate
    } catch {
      return [];
    }
  }

  function groupByCategory(pkgs) {
    const map = new Map();
    for (const p of pkgs) {
      if (!map.has(p.category)) map.set(p.category, []);
      map.get(p.category).push(p);
    }
    return map;
  }

  async function renderManager() {
    card.innerHTML = `<h2>Kelola Paket</h2><div class="kp-sub">Memuat data/manifest.js…</div>`;
    workingPackages = await loadPackagesForEdit();

    if (workingPackages.length === 0) {
      card.innerHTML = `
        <h2>Kelola Paket</h2>
        <div class="kp-sub">Belum ada paket terdaftar di data/manifest.js (mode lama / belum pernah convert pakai kategori).</div>
        <div class="kp-actions"><button class="kp-secondary" id="kp-close1">Tutup</button></div>
      `;
      document.getElementById('kp-close1').onclick = () => overlay.classList.remove('open');
      return;
    }

    const allCategories = [...new Set(workingPackages.map((p) => p.category))];
    const groups = groupByCategory(workingPackages);

    let html = `<h2>Kelola Paket</h2>
      <div class="kp-sub">Ganti nama kategori/paket atau pindah paket ke kategori lain. Ini cuma mengubah data/manifest.js — folder gambar & soal tidak disentuh sama sekali.</div>`;

    groups.forEach((pkgs, category) => {
      html += `<div class="kp-group" data-category="${escapeAttr(category)}">
        <div class="kp-group-head">
          <input type="text" class="kp-cat-name" value="${escapeAttr(category)}">
        </div>`;
      pkgs.forEach((p) => {
        html += `<div class="kp-pkg-row" data-id="${escapeAttr(p.id)}">
          <input type="text" class="kp-title" value="${escapeAttr(p.title)}">
          <select class="kp-move">
            ${allCategories.map((c) => `<option value="${escapeAttr(c)}" ${c === category ? 'selected' : ''}>${escapeAttr(c)}</option>`).join('')}
            <option value="__new__">+ kategori baru…</option>
          </select>
          <button class="kp-del" title="Hapus dari daftar">✕</button>
        </div>
        <input type="text" class="kp-newcat" placeholder="Nama kategori baru">`;
      });
      html += `</div>`;
    });

    html += `
      <details class="kp-settings">
        <summary>Pengaturan penyimpanan (opsional — push otomatis ke GitHub)</summary>
        <div class="kp-sub">Isi ini kalau mau tombol Simpan langsung commit ke repo. Kosongkan kalau mau tetap unduh file lalu push manual.</div>
        <label>Owner/organisasi GitHub</label><input type="text" id="kp-gh-owner">
        <label>Nama repo</label><input type="text" id="kp-gh-repo">
        <label>Branch</label><input type="text" id="kp-gh-branch" placeholder="main">
        <label>Personal Access Token (scope: Contents = Read and write, repo ini saja)</label>
        <input type="password" id="kp-gh-token">
      </details>

      <div class="kp-actions">
        <button id="kp-save">Simpan perubahan</button>
        <button class="kp-secondary" id="kp-close2">Tutup</button>
      </div>
      <div class="kp-status" id="kp-status"></div>
    `;

    card.innerHTML = html;

    const gh = getGhSettings();
    if (document.getElementById('kp-gh-owner')) {
      document.getElementById('kp-gh-owner').value = gh.owner || '';
      document.getElementById('kp-gh-repo').value = gh.repo || '';
      document.getElementById('kp-gh-branch').value = gh.branch || 'main';
      document.getElementById('kp-gh-token').value = gh.token || '';
    }

    card.querySelectorAll('.kp-move').forEach((sel) => {
      sel.addEventListener('change', () => {
        const newcatInput = sel.closest('.kp-pkg-row').nextElementSibling;
        if (sel.value === '__new__') { newcatInput.style.display = 'block'; newcatInput.focus(); }
        else { newcatInput.style.display = 'none'; }
      });
    });

    card.querySelectorAll('.kp-del').forEach((btn) => {
      btn.addEventListener('click', () => {
        const row = btn.closest('.kp-pkg-row');
        const newcat = row.nextElementSibling;
        row.dataset.deleted = '1';
        row.style.opacity = '0.35';
        btn.disabled = true;
      });
    });

    document.getElementById('kp-close2').onclick = () => overlay.classList.remove('open');
    document.getElementById('kp-save').onclick = doSave;
  }

  function escapeAttr(s) {
    return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function buildManifestContent(packages) {
    packages.sort((a, b) => a.category.localeCompare(b.category) || a.title.localeCompare(b.title));
    return `// File ini DIKELOLA lewat panel "Kelola Paket" di dalam app (dan/atau scripts/convert-docx.js).
// Berisi daftar semua "paket soal". Field "id" adalah nama folder asli
// (data/packages/<id>/ dan images/packages/<id>/) dan TIDAK PERNAH berubah
// walau "category"/"title" diganti dari panel ini — jadi ganti nama/pindah
// kategori aman, tidak pernah memindahkan/menghapus file gambar atau soal.

export const packages = ${JSON.stringify(packages, null, 2)};
`;
  }

  async function doSave() {
    const status = document.getElementById('kp-status');
    status.className = 'kp-status';
    status.textContent = 'Menyimpan…';

    const byId = new Map(workingPackages.map((p) => [p.id, p]));
    const rows = card.querySelectorAll('.kp-pkg-row');
    const finalPackages = [];

    // category renames: map old category text -> new text, per group block
    card.querySelectorAll('.kp-group').forEach((groupEl) => {
      const oldCategory = groupEl.dataset.category;
      const newCategoryName = groupEl.querySelector('.kp-cat-name').value.trim() || oldCategory;
      groupEl.querySelectorAll('.kp-pkg-row').forEach((row) => {
        if (row.dataset.deleted === '1') return;
        const id = row.dataset.id;
        const entry = byId.get(id);
        if (!entry) return;
        const title = row.querySelector('.kp-title').value.trim() || entry.title;
        const moveSel = row.querySelector('.kp-move');
        let category;
        if (moveSel.value === '__new__') {
          const newcatVal = row.nextElementSibling.value.trim();
          category = newcatVal || newCategoryName;
        } else if (moveSel.value === oldCategory) {
          category = newCategoryName; // stayed in this group, but group itself may have been renamed
        } else {
          category = moveSel.value;
        }
        finalPackages.push({ ...entry, title, category });
      });
    });

    if (finalPackages.length === 0) {
      status.className = 'kp-status kp-warn';
      status.textContent = 'Semua paket ditandai hapus — tidak jadi disimpan. Batalkan penghapusan kalau ini tidak sengaja.';
      return;
    }

    const content = buildManifestContent(finalPackages);

    const owner = (document.getElementById('kp-gh-owner')?.value || '').trim();
    const repo = (document.getElementById('kp-gh-repo')?.value || '').trim();
    const branch = (document.getElementById('kp-gh-branch')?.value || 'main').trim();
    const token = (document.getElementById('kp-gh-token')?.value || '').trim();

    if (owner && repo && token) {
      setGhSettings({ owner, repo, branch, token });
      try {
        status.textContent = 'Mengambil versi terbaru dari GitHub…';
        const apiBase = `https://api.github.com/repos/${owner}/${repo}/contents/data/manifest.js`;
        const getRes = await fetch(`${apiBase}?ref=${encodeURIComponent(branch)}`, {
          headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github+json' },
        });
        if (!getRes.ok) throw new Error(`GET gagal (${getRes.status}): ${await getRes.text()}`);
        const getData = await getRes.json();

        status.textContent = 'Mengirim commit…';
        const putRes = await fetch(apiBase, {
          method: 'PUT',
          headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: 'Kelola Paket: update data/manifest.js',
            content: btoa(unescape(encodeURIComponent(content))),
            sha: getData.sha,
            branch,
          }),
        });
        if (!putRes.ok) throw new Error(`PUT gagal (${putRes.status}): ${await putRes.text()}`);
        status.className = 'kp-status kp-ok';
        status.textContent = 'Berhasil di-commit ke GitHub. Refresh halaman ini untuk lihat perubahan di app.';
      } catch (e) {
        status.className = 'kp-status kp-warn';
        status.textContent = `Gagal push otomatis: ${e.message}\nFile tetap diunduh sebagai cadangan.`;
        downloadManifest(content);
      }
    } else {
      downloadManifest(content);
      status.className = 'kp-status kp-ok';
      status.textContent = 'File data/manifest.js diunduh. Push manual: buka repo di GitHub (bisa lewat web editor / Codespaces), timpa data/manifest.js dengan file ini, lalu commit.';
    }
  }

  function downloadManifest(content) {
    const blob = new Blob([content], { type: 'text/javascript' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'manifest.js';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }
})();
</script>
