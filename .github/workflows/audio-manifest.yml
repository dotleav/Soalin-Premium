name: Update audio manifest

on:
  push:
    paths:
      - 'audio/benar/**'
      - 'audio/salah/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate manifest
        run: node scripts/generate-audio-manifest.cjs

      - name: Commit kalau berubah
        run: |
          if [ -n "$(git status --porcelain audio/manifest.js)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add audio/manifest.js
            git commit -m "chore: update audio manifest"
            git push
          fi
